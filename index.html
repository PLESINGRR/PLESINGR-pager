                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

        function renderKasaReceipt() {
            const receiptEl = document.getElementById('kasaReceiptItems');
            if (!receiptEl) return;
            receiptEl.innerHTML = "";

            let totalCost = 0;
            let totalPrice = 0;

            kasaCart.forEach((item, index) => {
                totalCost += item.cost * item.qty;
                totalPrice += item.price * item.qty;
                receiptEl.innerHTML += `
                    <div class="item-row-kasa">
                        <span>${item.name} x${item.qty}</span>
                        <span><b>${item.price * item.qty} $</b> 
                            <button class="qty-btn" style="width:20px;height:20px;font-size:10px;" onclick="changeKasaQty(${index}, -1)">-</button>
                            <button class="qty-btn" style="width:20px;height:20px;font-size:10px;" onclick="changeKasaQty(${index}, 1)">+</button>
                        </span>
                    </div>`;
            });

            let profit = totalPrice - totalCost;
            let bartenderShare = Math.round(profit * 0.15);

            const costEl = document.getElementById('kasaFinCost');
            const profitEl = document.getElementById('kasaFinProfit');
            const bartenderEl = document.getElementById('kasaFinBartender');
            const totalEl = document.getElementById('kasaTotalPrice');

            if (costEl) costEl.innerText = totalCost + " $";
            if (profitEl) profitEl.innerText = profit + " $";
            if (bartenderEl) bartenderEl.innerText = bartenderShare + " $";
            if (totalEl) totalEl.innerText = totalPrice + " $";
        }

        async function processAndVerifyToken(accessToken) {
            try {
                const userRes = await fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${accessToken}` }
                });
                if (!userRes.ok) return false;
                const userData = await userRes.json();

                const memberRes = await fetch(`https://discord.com/api/users/@me/guilds/${DISCORD_GUILD_ID}/member`, {
                    headers: { authorization: `Bearer ${accessToken}` }
                });

                let hasAccess = false;
                let isAdmin = false;
                let isSecretario = false;
                let isServerAdmin = false;

                if (memberRes.ok) {
                    const memberData = await memberRes.json();
                    if (memberData && memberData.roles) {
                        const hasMiembro = memberData.roles.includes(MIEMBRO_ROLE);
                        const hasAdminRole = memberData.roles.some(roleId => ADMIN_ROLES.includes(roleId));
                        const hasSecretarioRole = memberData.roles.includes(SECRETARIO_ROLE);
                        const hasServerAdminRole = memberData.roles.includes(SERVER_ADMIN_ROLE);

                        if (hasServerAdminRole) {
                            hasAccess = true;
                            isServerAdmin = true;
                        } else if (hasMiembro || hasAdminRole || hasSecretarioRole) {
                            hasAccess = true;
                            if (hasAdminRole) {
                                isAdmin = true;
                            } else if (hasSecretarioRole) {
                                isSecretario = true;
                            }
                        }
                    }
                }

                state.discordUser = userData.username;
                state.isAuthenticated = true;
                state.hasAccess = hasAccess;
                state.isAdmin = isAdmin;
                state.isSecretario = isSecretario;
                state.isServerAdmin = isServerAdmin;

                const sessionData = {
                    isAuthenticated: true,
                    hasAccess: hasAccess,
                    isAdmin: isAdmin,
                    isSecretario: isSecretario,
                    isServerAdmin: isServerAdmin,
                    discordUser: userData.username,
                    token: accessToken
                };
                localStorage.setItem('pager_user_session', JSON.stringify(sessionData));
                return true;
            } catch (e) {
                return false;
            }
        }

        async function loadSessionFromStorage() {
            const saved = localStorage.getItem('pager_user_session');
            if (!saved) return false;
            
            try {
                const data = JSON.parse(saved);
                if (!data.token) return false;

                const success = await processAndVerifyToken(data.token);
                if (!success) {
                    localStorage.removeItem('pager_user_session');
                    return false;
                }
                return true;
            } catch(e) {
                localStorage.removeItem('pager_user_session');
                return false;
            }
        }

        async function fetchChatMessages(shouldRender = false) {
            if (!supabaseClient || state.isServerAdmin) return;
            try {
                let { data: chatData, error } = await supabaseClient.from('chat').select('*').order('created_at', { ascending: true });
                if (error) return;
                if (chatData) {
                    const newMessages = chatData.map(m => ({
                        id: m.id, sender: m.sender, text: m.text,
                        time: new Date(m.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        isAdmin: m.is_admin
                    }));
                    
                    if (newMessages.length !== chatMessages.length || JSON.stringify(newMessages) !== JSON.stringify(chatMessages)) {
                        chatMessages = newMessages;
                        if (shouldRender && state.hasAccess && openedTab === 'livechat') {
                            const activeInput = document.getElementById('chatInputField');
                            const savedText = activeInput ? activeInput.value : "";
                            render();

                }
            } catch (err) {}
        }

        async function loadCloudData() {
            await checkDiscordAuth();
            if (!state.isAuthenticated) { await loadSessionFromStorage(); }
            if (!supabaseClient) { render(); return; }
            try {
                let { data: appData } = await supabaseClient.from('app_data').select('data').eq('key', 'main_state').single();
                if (appData && appData.data) {
                    const cloudState = appData.data;
                    state.slozky = cloudState.slozky || state.slozky;
                    state.prodej_meth = cloudState.prodej_meth || state.prodej_meth;
                    state.zamestnanci = cloudState.zamestnanci || state.zamestnanci;
                    state.oznameni = cloudState.oznameni || state.oznameni;
                    state.info = cloudState.info || state.info;
                    state.kaple = cloudState.kaple || state.kaple;
                    state.parking = cloudState.parking || state.parking;
                    state.pujcky = cloudState.pujcky || state.pujcky;
                    state.pokuty = cloudState.pokuty || state.pokuty;
                    state.kontakty = cloudState.kontakty || state.kontakty;
                    state.currentFreq = cloudState.currentFreq || state.currentFreq;
                }
                
                if (!state.isServerAdmin) {
                    await fetchChatMessages(false);
                    supabaseClient.channel('public:chat')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat' }, payload => {
                            const m = payload.new;
                            if (!chatMessages.some(e => e.id === m.id)) {
                                chatMessages.push({
                                    id: m.id, sender: m.sender, text: m.text,
                                    time: new Date(m.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                                    isAdmin: m.is_admin
                                });
                                if (state.hasAccess && openedTab === 'livechat') {
                                    render();
                                    scrollToBottomChat();
                                }
                            }
                        })
                        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'chat' }, () => { fetchChatMessages(true); })
                        .subscribe();
                }

                supabaseClient.channel('public:app_data')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_data' }, payload => {
                        if (payload.new && payload.new.key === 'main_state' && payload.new.data) {
                            const cloudState = payload.new.data;
                            state.slozky = cloudState.slozky || state.slozky;
                            state.prodej_meth = cloudState.prodej_meth || state.prodej_meth;
                            state.zamestnanci = cloudState.zamestnanci || state.zamestnanci;
                            state.oznameni = cloudState.oznameni || state.oznameni;
                            state.info = cloudState.info || state.info;
                            state.kaple = cloudState.kaple || state.kaple;
                            state.parking = cloudState.parking || state.parking;
                            state.pujcky = cloudState.pujcky || state.pujcky;
                            state.pokuty = cloudState.pokuty || state.pokuty;
                            state.kontakty = cloudState.kontakty || state.kontakty;
                            state.currentFreq = cloudState.currentFreq || state.currentFreq;
                            render();
                        }
                    })
                    .subscribe();

                document.getElementById('cloudStatus').innerText = "SYNCHRONIZACE: LIVE (ONLINE)";
            } catch (err) {
                document.getElementById('cloudStatus').innerText = "SYNCHRONIZACE: LOKÁLNÍ REŽIM";
            }
            render();
        }

                }
            } else if (category === 'pujcky') {
                if (!state.isAdmin) return;
                const debtor = document.getElementById('loan_debtor').value;
                const amount = document.getElementById('loan_amount').value;
                const note = document.getElementById('loan_note')?.value || '';
                if (!debtor || !amount) return;
                if (editingItemId) {
                    let item = state.pujcky.find(i => i.id === editingItemId);
                    if (item) { item.debtor = debtor; item.amount = amount; item.note = note; }
                } else {
                    state.pujcky.push({ id: Date.now(), author, debtor, amount, note });
                }
            } else if (category === 'pokuty') {
                if (!state.isAdmin) return;
                const member = document.getElementById('fine_member').value;
                const amount = document.getElementById('fine_amount').value;
                const reason = document.getElementById('fine_reason')?.value || '';
                if (!member || !amount) return;
                if (editingItemId) {
                    let item = state.pokuty.find(i => i.id === editingItemId);
                    if (item) { item.member = member; item.amount = amount; item.reason = reason; }
                } else {
                    state.pokuty.push({ id: Date.now(), author, member, amount, reason });
                }
            } else if (category === 'kontakty') {
                const name = document.getElementById('contact_name').value;
                const phone = document.getElementById('contact_phone').value;
                const note = document.getElementById('contact_note')?.value || '';
                if (!name || !phone) return;
                if (editingItemId) {
                    let item = state.kontakty.find(i => i.id === editingItemId);
                    if (item && (state.isAdmin || item.author === author)) { item.name = name; item.phone = phone; item.note = note; }
                } else {
                    state.kontakty.push({ id: Date.now(), author, name, phone, note });
                }
            }
            editingItemId = null;
            saveCloudState();
            playBeep(920, 0.04, 'sine', 0.04);
            render();
        }

        function deleteItem(category, id) {
            if (!state.hasAccess || state.isServerAdmin) return;
            let item = state[category].find(i => i.id === id);
            if (!item) return;

            state[category] = state[category].filter(i => i.id !== id);
            saveCloudState();
            playBeep(350, 0.06, 'sawtooth', 0.04);
            render();
        }

        function updateFrequency() {
            if (!state.hasAccess || state.isServerAdmin) return;
            const newFreq = document.getElementById('freqInput').value;
            if(!newFreq) return;
            state.currentFreq = newFreq;
            state.hasUnreadFreq = true;
            saveCloudState();
            playBeep(900, 0.04, 'sine', 0.04);
            render();
        }

        function updateUIState() {
            const btn = document.getElementById('dcRoleBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const flipBtn = document.getElementById('flipBtn');
            
            if (state.isAuthenticated) { logoutBtn.style.display = "flex"; } else { logoutBtn.style.display = "none"; }
            let icIdentityName = getCurrentAuthorName();

            if(state.isServerAdmin) {
                btn.innerHTML = `👁️ SERVER DOZOR [ADMIN]`;
                btn.classList.add('is-server-admin');
                btn.classList.remove('is-admin');
                flipBtn.style.display = "none";
            } else if(state.isAdmin) {
                btn.innerHTML = `👑 VEDENÍ [${icIdentityName}]`;
                btn.classList.add('is-admin');
                btn.classList.remove('is-server-admin');
                flipBtn.style.display = "flex";
            } else if(state.isSecretario) {
                btn.innerHTML = `📋 SECRETARIO [${icIdentityName}]`;
                btn.classList.add('is-admin');
                btn.classList.remove('is-server-admin');
                flipBtn.style.display = "none";
            } else if(state.isAuthenticated) {
                btn.innerHTML = `👤 ${icIdentityName.toUpperCase()} [PŘIPOJENO]`;
                btn.classList.remove('is-admin');
                btn.classList.remove('is-server-admin');
                flipBtn.style.display = "none";
            } else {
                btn.innerHTML = `📡 PŘIPOJIT K SÍTI`;
                btn.classList.remove('is-admin');
                btn.classList.remove('is-server-admin');
                flipBtn.style.display = "none";
            }
        }

        function navigateMenu(direction) {
            if (!state.hasAccess || openedTab !== null || isFlipped || activeModalImage !== null) return;
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = tabsList.length - 1;
            if (currentIndex >= tabsList.length) currentIndex = 0;
            playBeep(650, 0.03, 'sine', 0.025);
            render();
            
            const bodyEl = document.getElementById('screenBody');
            const focusedEl = bodyEl.querySelector('.menu-item-row.focused');
            if (focusedEl) { focusedEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
        }

        function openSelectedTab() {
            if (!state.hasAccess) return;
            if (activeModalImage !== null) { closeImageModal(); return; }
            if (openedTab !== null || isFlipped) return;
            
            const selectedTabId = tabsList[currentIndex].id;

            if (selectedTabId === 'slozky' && state.isServerAdmin) {
                playBeep(300, 0.1, 'sawtooth', 0.04);
                alert("Nemáš oprávnění zobrazit tuto sekci.");
                return;
            }

            if (state.isServerAdmin && (selectedTabId === 'livechat' || selectedTabId === 'kaple' || selectedTabId === 'pujcky' || selectedTabId === 'pokuty' || selectedTabId === 'prodej_meth')) {
                playBeep(300, 0.1, 'sawtooth', 0.04);
                return;
            }

            if (!state.isAdmin && (selectedTabId === 'pujcky' || selectedTabId === 'pokuty' || selectedTabId === 'prodej_meth')) {
                playBeep(300, 0.1, 'sawtooth', 0.04);
                alert("Nemáš oprávnění zobrazit tuto sekci (vyžadována role Vedení).");
                return;
            }

            playBeep(880, 0.05, 'triangle', 0.035);
            openedTab = selectedTabId;
            editingItemId = null;
            selectedEmployeeId = null;
            if (openedTab === 'oznameni') state.hasUnreadAnnouncements = false;
            if (openedTab === 'freq') state.hasUnreadFreq = false;
            saveCloudState();
            render();
            if (openedTab === 'livechat' && !state.isServerAdmin) { fetchChatMessages(true); }
        }

        function goBackToMenu() {
            if (!state.hasAccess) return;
            if (activeModalImage !== null) { closeImageModal(); return; }
            if (isFlipped) { toggleFlip(); return; }
            
            if (openedTab === 'zamestnanci' && selectedEmployeeId !== null) {
                selectedEmployeeId = null;
                playBeep(550, 0.04, 'sine', 0.03);
                render();
                return;
            }
            
            if (editingItemId !== null) { editingItemId = null; playBeep(550, 0.04, 'sine', 0.03); render(); return; }
            if (openedTab !== null) { playBeep(500, 0.04, 'sine', 0.03); }
            openedTab = null;
            render();
        }

        function toggleFlip() {
            if (!state.isAdmin) return;
            isFlipped = !isFlipped;
            playBeep(750, 0.04, 'triangle', 0.035);
            render();
        }

        function exportDatabaseJson() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `pager_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importDatabaseJson(event) {
            const fileReader = new FileReader();
            if (event.target.files && event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = async function (e) {
                    try {
                        const parsedData = JSON.parse(e.target.result);
                        if (parsedData && parsedData.zamestnanci) {
                            state = parsedData;
                            await saveCloudState();
                            alert("Záloha byla úspěšně importována a uložena!");
                            isFlipped = false;
                            playBeep(950, 0.06, 'sine', 0.04);
                            render();
                        }
                    } catch (err) {}
                };
            }
        }

        function showImageModal(url) { activeModalImage = url; playBeep(800, 0.03, 'sine', 0.03); render(); }
        function closeImageModal() { activeModalImage = null; playBeep(500, 0.03, 'sine', 0.03); render(); }

        document.addEventListener('keydown', (e) => {
            if (!state.hasAccess) return;
            const activeTag = document.activeElement?.tagName;
            const isTyping = (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT');

            if (activeModalImage !== null) { if (e.key === 'Escape' || e.key === 'Enter') closeImageModal(); return; }
            if (isFlipped) { if (e.key === 'Escape') toggleFlip(); return; }
            if (openedTab === 'livechat' && document.activeElement?.id === 'chatInputField' && !state.isServerAdmin) {
                if (e.key === 'Enter') { sendChatMessage(); e.preventDefault(); }
                return;
            }
            if (isTyping) return;

            if (e.key === 'ArrowUp' && openedTab === null) { navigateMenu(-1); e.preventDefault(); }
            else if (e.key === 'ArrowDown' && openedTab === null) { navigateMenu(1); e.preventDefault(); }
            else if (e.key === 'Enter' && openedTab === null) { openSelectedTab(); e.preventDefault(); }
            else if (e.key === 'Backspace' || e.key === 'Escape') { goBackToMenu(); e.preventDefault(); }
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
            else if (document.exitFullscreen) document.exitFullscreen();
        }

                                <div class="terminal-title">➕ PŘIDAT ZÁZNAM DO SLOŽKY</div>
                                <input type="text" id="zaznam_title" class="pager-edit-input" placeholder="Popis transakce / záznamu..." style="margin-bottom:6px;">
                                <input type="text" id="zaznam_proof" class="pager-edit-input" placeholder="Link na důkaz (volitelné)..." style="margin-bottom:6px;">
                                <button class="edit-action-btn save-action-btn" onclick="addZaznamToEmployee(${emp.id})">Přidat záznam</button>
                            </div>`;

                            contentHTML += `<div style="font-size:12px; color:#f39c12; margin-bottom:4px;"><b>ZÁZNAMY A TRANSAKCE:</b></div>`;
                            if (!emp.zaznamy || emp.zaznamy.length === 0) {
                                contentHTML += `<div style="font-size:11px; color:#555;">Žádné záznamy.</div>`;
                            } else {
                                emp.zaznamy.forEach(z => {
                                    let currentAuthor = getCurrentAuthorName();
                                    let canDelZaznam = (state.isAdmin || z.author === currentAuthor || emp.ownerDiscord === state.discordUser);
                                    contentHTML += `<div class="terminal-card" style="padding:8px 10px; margin-bottom:6px;">
                                        <div style="display:flex; justify-content:space-between; align-items:center;">
                                            <span style="font-size:12px; color:#4cd137;">${z.title}</span>
                                            ${canDelZaznam ? `<button class="edit-action-btn delete-action-btn" onclick="deleteZaznam(${emp.id},${z.id})" style="font-size:9px; padding:2px 6px;">Smazat</button>` : ''}
                                        </div>
                                        ${z.proofUrl ? `<button class="edit-action-btn save-action-btn" onclick="showImageModal('${z.proofUrl}')" style="margin-top:4px; font-size:10px;">🔍 Zobrazit důkaz</button>` : ''}
                                    </div>`;
                                });
                            }
                        }
                    } else {
                        contentHTML += `<table><tr><th>JMÉNO SLOŽKY</th><th>AKCE</th></tr>`;
                        state.zamestnanci.forEach(e => {
                            let isMyFolder = (state.discordUser && e.ownerDiscord === state.discordUser);
                            if (!state.isAdmin && !state.isServerAdmin && !isMyFolder) return;
                            contentHTML += `<tr><td><a href="#" onclick="selectedEmployeeId=${e.id}; render(); return false;" style="color:${isMyFolder ? '#4cd137' : '#f39c12'}; text-decoration:underline;">📁 ${e.name}</a></td><td><button class="edit-action-btn" onclick="selectedEmployeeId=${e.id}; render();">Otevřít</button></td></tr>`;
                        });
                        contentHTML += `</table>`;
                    }
                }
                else if (openedTab === 'oznameni') {
                    state.oznameni.forEach(item => {
                        contentHTML += `<div class="terminal-card"><div class="terminal-title"># ${item.title}</div><div>${item.text}</div></div>`;
                    });
                }
                else if (openedTab === 'info') {
                    state.info.forEach(item => {
                        contentHTML += `<div class="terminal-card"><div class="terminal-title"># ${item.title}</div><div>${item.text}</div></div>`;
                    });
                }
                else if (openedTab === 'freq') {
                    contentHTML += `<div class="terminal-card"><div class="terminal-title">FREKVENCE</div><div style="font-size:20px; color:#f39c12; margin-bottom:10px;">${state.currentFreq}</div><input type="text" id="freqInput" class="pager-edit-input" value="${state.currentFreq}"><button class="edit-action-btn save-action-btn" onclick="updateFrequency()" style="margin-top:6px;">Změnit Freq</button></div>`;
                }
                else if (openedTab === 'kaple') {
                    state.kaple.forEach(k => {
                        contentHTML += `<div class="terminal-card"><div class="terminal-title"># ${k.title}</div><div>${k.text}</div></div>`;
                    });
                }
                else if (openedTab === 'parking') {
                    contentHTML += `<table><tr><th>RANK</th><th>MÍSTO</th></tr>`;
                    state.parking.forEach(p => { contentHTML += `<tr><td>${p.rank}</td><td>${p.spot}</td></tr>`; });
                    contentHTML += `</table>`;
                }
                else if (openedTab === 'pujcky' && state.isAdmin) {
                    contentHTML += `<table><tr><th>DLUŽNÍK</th><th>ČÁSTKA</th></tr>`;
                    state.pujcky.forEach(p => { contentHTML += `<tr><td>${p.debtor}</td><td><b>${p.amount}</b></td></tr>`; });
                    contentHTML += `</table>`;
                }
                else if (openedTab === 'pokuty' && state.isAdmin) {
                    contentHTML += `<table><tr><th>ČLEN</th><th>VÝŠE</th></tr>`;
                    state.pokuty.forEach(p => { contentHTML += `<tr><td>${p.member}</td><td><b style="color:#ff6b81;">${p.amount}</b></td></tr>`; });
                    contentHTML += `</table>`;
                }
                else if (openedTab === 'prodej_meth' && state.isAdmin) {
                    contentHTML += `<table><tr><th>KOMU</th><th>ZA KOLIK</th></tr>`;
                    state.prodej_meth.forEach(p => { contentHTML += `<tr><td>${p.komu}</td><td><b style="color:#a3e635;">${p.zaKolik}</b></td></tr>`; });
                    contentHTML += `</table>`;
                }
                else if (openedTab === 'kontakty') {
                    contentHTML += `<table><tr><th>JMÉNO</th><th>TELEFON</th></tr>`;
                    state.kontakty.forEach(k => { contentHTML += `<tr><td>${k.name}</td><td>${k.phone}</td></tr>`; });
                    contentHTML += `</table>`;
                }

                body.innerHTML = contentHTML;
                setTimeout(() => {
                    if (openedTab === 'kasa') renderKasaReceipt();
                }, 50);
            }
        }

        setInterval(() => {
            document.getElementById('screenTime').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        loadCloudData();
    </script>
</body>
</html>
