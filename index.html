<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicano Notes - Multi Canvas Cloud Sync</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #313338; color: #dbdee1; 
            height: 100vh; overflow: hidden; display: flex;
        }

        /* Levý panel - Seznam složek */
        .sidebar { 
            width: 280px; background-color: #2b2d31; 
            display: flex; flex-direction: column; 
            border-right: 1px solid #1f2023; z-index: 1000;
        }
        .sidebar-header { 
            padding: 20px; font-weight: bold; font-size: 16px; color: #fff; 
            border-bottom: 2px solid #1f2023; text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .channel-list { 
            flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 4px; 
        }
        .channel-item { 
            padding: 8px 10px; border-radius: 4px; cursor: pointer; 
            color: #949ba4; font-size: 14px; display: flex; justify-content: space-between; align-items: center;
            transition: 0.15s; word-break: break-all;
        }
        .channel-item:hover { background-color: #35373c; color: #dbdee1; }
        .channel-item.active { background-color: #404249; color: #fff; font-weight: 500; }
        .channel-actions { display: flex; gap: 2px; align-items: center; }
        .channel-btn { background: none; border: none; color: #949ba4; cursor: pointer; font-size: 11px; padding: 2px; }
        .channel-btn:hover { color: #fff; }
        .channel-item .delete-btn { color: #f23f43; }

        .add-channel-box { padding: 10px; background-color: #232428; display: flex; gap: 6px; }
        .add-channel-box input { 
            flex: 1; background-color: #1e1f22; border: none; padding: 8px; border-radius: 4px; color: #fff; outline: none; font-size: 13px;
        }
        .add-channel-box button { 
            background-color: #248046; color: #fff; border: none; padding: 0 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .add-channel-box button:hover { background-color: #1a6334; }

        /* Hlavní plocha */
        .main-content { 
            flex: 1; display: flex; flex-direction: column; background-color: #313338; 
            min-width: 0; position: relative; overflow: hidden;
        }
        .chat-header { 
            height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
            font-size: 16px; font-weight: bold; color: #fff; border-bottom: 1px solid #1f2023; 
            background-color: #2b2d31; gap: 10px; flex-shrink: 0; z-index: 1000;
        }
        
        /* Nastavení cloudu v hlavičce */
        .cloud-settings { display: flex; gap: 6px; align-items: center; font-size: 12px; flex-wrap: wrap; }
        .cloud-settings input { background: #1e1f22; border: 1px solid #404249; color: #fff; padding: 4px 8px; border-radius: 4px; width: 110px; }
        .cloud-settings button { background: #5865f2; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .cloud-settings button:hover { background: #4752c4; }

        /* Lišta záložek (pláten) v rámci složky */
        .tabs-bar {
            display: flex; align-items: center; background-color: #232428; padding: 0 20px;
            border-bottom: 1px solid #1f2023; gap: 8px; height: 45px; flex-shrink: 0; z-index: 1000; overflow-x: auto;
        }
        .tab-item {
            padding: 4px 10px; background-color: #2b2d31; color: #949ba4; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; white-space: nowrap; border: 1px solid #1f2023;
        }
        .tab-item:hover { background-color: #35373c; color: #dbdee1; }
        .tab-item.active { background-color: #404249; color: #fff; border-color: #5865f2; }
        .tab-item .tab-btn { background: none; border: none; color: #949ba4; cursor: pointer; font-size: 11px; padding: 2px; }
        .tab-item .tab-btn:hover { color: #fff; }
        .tab-item .delete-tab-btn { color: #f23f43; }

        .add-tab-box { display: flex; gap: 4px; align-items: center; margin-left: auto; }
        .add-tab-box input { background: #1e1f22; border: none; color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 12px; outline: none; width: 120px; }
        .add-tab-box button { background: #248046; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .add-tab-box button:hover { background: #1a6334; }

        /* Tlačítko pro přidání nového okna na aktuální plátno */
        .window-creator-bar {
            display: flex; gap: 6px; padding: 8px 20px; background-color: #313338; align-items: center; flex-wrap: wrap; flex-shrink: 0; border-bottom: 1px solid #1f2023; z-index: 1000;
        }
        .add-window-box { display: flex; gap: 4px; align-items: center; }
        .add-window-box input { background: #2b2d31; border: 1px solid #1f2023; color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 12px; outline: none; width: 140px; }
        .add-window-box button { background: #248046; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .add-window-box button:hover { background: #1a6334; }

        /* Formátovací lišta nahoře */
        .formatting-bar {
            display: flex; gap: 6px; padding: 6px 20px; background-color: #2b2d31; align-items: center; flex-wrap: wrap; flex-shrink: 0; border-bottom: 1px solid #1f2023; z-index: 1000;
        }
        .formatting-bar button {
            background-color: #313338; color: #dbdee1; border: 1px solid #1f2023; padding: 5px 10px;
            border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .formatting-bar button:hover { background-color: #35373c; color: #fff; border-color: #5865f2; }
        
        .color-picker-wrapper {
            display: flex; align-items: center; gap: 4px; background: #313338; padding: 2px 6px; border-radius: 4px; border: 1px solid #1f2023; font-size: 12px; color: #949ba4; cursor: pointer;
        }
        .color-picker-wrapper input[type="color"] {
            border: none; width: 18px; height: 18px; background: none; cursor: pointer;
        }

        /* Plocha plovoucích oken */
        .canvas-area {
            flex: 1; position: relative; overflow: hidden; background: radial-gradient(circle, #35383f 1px, transparent 1px); background-size: 24px 24px; background-color: #313338;
        }

        /* Plovoucí okno (Widget) */
        .floating-window {
            position: absolute;
            background-color: #313338;
            border: 1px solid #1f2023;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            min-width: 250px;
            min-height: 180px;
            resize: both;
            overflow: hidden;
            z-index: 10;
        }
        .floating-window.active-window {
            border-color: #5865f2;
            z-index: 100;
        }
        .window-header {
            background-color: #2b2d31;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            border-bottom: 1px solid #1f2023;
            user-select: none;
            flex-shrink: 0;
        }
        .window-header:active { cursor: grabbing; }
        .window-title { font-size: 13px; font-weight: bold; color: #fff; }
        .window-controls { display: flex; gap: 6px; align-items: center; }
        .window-btn { background: none; border: none; color: #949ba4; cursor: pointer; font-size: 12px; font-weight: bold; }
        .window-btn:hover { color: #fff; }
        .window-btn.delete { color: #f23f43; }

        .window-body {
            flex: 1;
            padding: 12px;
            background-color: #383a40;
            color: #dbdee1;
            font-size: 14px;
            outline: none;
            overflow-y: auto;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .window-body ul, .window-body ol { padding-left: 20px; margin: 5px 0; }

        .share-info {
            padding: 8px 20px; background-color: #2b2d31; font-size: 11px; color: #949ba4; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 1000; border-top: 1px solid #1f2023;
        }
        #syncStatus { color: #f0b232; font-weight: bold; }

        /* Pravý panel s emoty */
        .emoji-sidebar {
            width: 280px; background-color: #2b2d31; border-left: 1px solid #1f2023;
            display: flex; flex-direction: column; height: 100%;
            transition: width 0.2s ease, opacity 0.2s ease; flex-shrink: 0; z-index: 1000;
        }
        .emoji-sidebar.hidden { width: 0; overflow: hidden; border: none; opacity: 0; }
        .emoji-sidebar-header {
            padding: 15px 20px; font-weight: bold; font-size: 14px; color: #fff;
            border-bottom: 1px solid #1f2023; background-color: #232428; text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; justify-content: space-between; align-items: center; white-space: nowrap;
        }
        .close-emoji-btn { background: none; border: none; color: #949ba4; cursor: pointer; font-size: 16px; font-weight: bold; }
        .close-emoji-btn:hover { color: #fff; }

        .emoji-sidebar-content {
            flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; min-width: 280px;
        }
        .emoji-category-title { font-size: 11px; color: #949ba4; text-transform: uppercase; font-weight: bold; margin-bottom: 4px; }
        .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        .emoji-btn {
            background: #313338; border: 1px solid #1f2023; font-size: 20px; cursor: pointer; padding: 6px 0; border-radius: 4px; text-align: center;
            transition: 0.1s;
        }
        .emoji-btn:hover { background: #35373c; border-color: #5865f2; transform: scale(1.1); }
    </style>
</head>
<body>

    <!-- Levý panel - Složky -->
    <div class="sidebar">
        <div class="sidebar-header">PLESINGR Notes</div>
        <div class="channel-list" id="channelList"></div>
        <div class="add-channel-box">
            <input type="text" id="newChannelName" placeholder="Nová složka..." onkeypress="if(event.key === 'Enter') addChannel()">
            <button onclick="addChannel()">＋</button>
        </div>
    </div>

    <!-- Prostřední hlavní část -->
    <div class="main-content">
        <div class="chat-header">
            <span id="currentChannelTitle"># vyber-složku</span>
            <div class="cloud-settings">
                <input type="text" id="binIdInput" placeholder="JSONBin ID">
                <input type="password" id="apiKeyInput" placeholder="API Key">
                <button onclick="saveCloudConfig()">Uložit klíče</button>
                <button onclick="fetchFromCloud()" style="background: #248046;">Stáhnout z cloudu</button>
                <button onclick="exportBackup()" style="background: #6c757d;" title="Stáhnout zálohu do souboru">💾 Záloha</button>
                <button onclick="document.getElementById('importFile').click()" style="background: #6c757d;" title="Nahrát zálohu ze souboru">📂 Nahrát</button>
                <button onclick="toggleEmojiSidebar()" style="background: #4f545c;" title="Zobrazit/skrýt panel emotů">😊 Emoty</button>
                <button onclick="toggleFullScreen()" style="background: #f0b232; color: #000;" title="Celá obrazovka">🖥️ Fullscreen</button>
                <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importBackup(event)">
            </div>
        </div>
        
        <!-- Lišta záložek (Pláten) v rámci složky -->
        <div class="tabs-bar" id="tabsBar">
            <div class="add-tab-box">
                <input type="text" id="newCanvasTabName" placeholder="Nové plátno..." onkeypress="if(event.key === 'Enter') addCanvasTab()">
                <button onclick="addCanvasTab()">＋ Plátno</button>
            </div>
        </div>

        <!-- Lišta pro vytvoření nového okna na aktuálním plátnu -->
        <div class="window-creator-bar">
            <div class="add-window-box">
                <input type="text" id="newWindowName" placeholder="Název okna..." onkeypress="if(event.key === 'Enter') addFloatingWindow()">
                <button onclick="addFloatingWindow()">＋ Přidat okno na plátno</button>
            </div>
        </div>

        <!-- Formátovací lišta -->
        <div class="formatting-bar">
            <button onclick="formatText('bold')" title="Tučně"><b>B</b></button>
            <button onclick="formatText('italic')" title="Kurzíva"><i>I</i></button>
            <button onclick="formatText('underline')" title="Podtrženo"><u>U</u></button>
            <button onclick="formatText('strikeThrough')" title="Přeškrtnuto"><s>S</s></button>
            
            <button onclick="changeFontSize('12px')" title="Malý text / emoji">A-</button>
            <button onclick="changeFontSize('15px')" title="Normální text / emoji">A</button>
            <button onclick="changeFontSize('22px')" title="Velký text / emoji">A+</button>
            <button onclick="changeFontSize('32px')" title="Obří text / emoji">A++</button>

            <button onclick="formatText('insertUnorderedList')" title="Odrážky (tečky)">• Odrážky</button>

            <label class="color-picker-wrapper" title="Barva textu / emoji">
                Barva: <input type="color" id="textColorPicker" onchange="formatText('foreColor', this.value)" value="#ffffff">
            </label>
        </div>

        <!-- Plocha, kde budou okna poletovat -->
        <div class="canvas-area" id="canvasArea"></div>

        <div class="share-info">
            <span id="syncStatus">Cloud: Nenastaveno (vyplň nahoře údaje)</span>
        </div>
    </div>

    <!-- Pravý panel s emoty -->
    <div class="emoji-sidebar" id="emojiSidebar">
        <div class="emoji-sidebar-header">
            <span>😊 Panel emotů</span>
            <button class="close-emoji-btn" onclick="toggleEmojiSidebar()" title="Zavřít panel">✕</button>
        </div>
        <div class="emoji-sidebar-content">
            <div class="emoji-category-title">📄 RP Papíry & Dokumenty</div>
            <div class="emoji-grid">
                <button class="emoji-btn" onclick="insertEmoji('📜')">📜</button>
                <button class="emoji-btn" onclick="insertEmoji('📄')">📄</button>
                <button class="emoji-btn" onclick="insertEmoji('📃')">📃</button>
                <button class="emoji-btn" onclick="insertEmoji('📑')">📑</button>
                <button class="emoji-btn" onclick="insertEmoji('📖')">📖</button>
                <button class="emoji-btn" onclick="insertEmoji('📘')">📘</button>
                <button class="emoji-btn" onclick="insertEmoji('📙')">📙</button>
                <button class="emoji-btn" onclick="insertEmoji('📔')">📔</button>
            </div>

            <div class="emoji-category-title">💊 RP & Drogy</div>
            <div class="emoji-grid">
                <button class="emoji-btn" onclick="insertEmoji('🌿')">🌿</button>
                <button class="emoji-btn" onclick="insertEmoji('🍃')">🍃</button>
                <button class="emoji-btn" onclick="insertEmoji('💊')">💊</button>
                <button class="emoji-btn" onclick="insertEmoji('💉')">💉</button>
                <button class="emoji-btn" onclick="insertEmoji('🧪')">🧪</button>
                <button class="emoji-btn" onclick="insertEmoji('🧊')">🧊</button>
                <button class="emoji-btn" onclick="insertEmoji('🚬')">🚬</button>
                <button class="emoji-btn" onclick="insertEmoji('🥃')">🥃</button>
            </div>

            <div class="emoji-category-title">Vozidla & Doprava</div>
            <div class="emoji-grid">
                <button class="emoji-btn" onclick="insertEmoji('🚗')">🚗</button>
                <button class="emoji-btn" onclick="insertEmoji('🚙')">🚙</button>
                <button class="emoji-btn" onclick="insertEmoji('🏎️')">🏎️</button>
                <button class="emoji-btn" onclick="insertEmoji('🚕')">🚕</button>
                <button class="emoji-btn" onclick="insertEmoji('🏍️')">🏍️</button>
                <button class="emoji-btn" onclick="insertEmoji('✈️')">✈️</button>
                <button class="emoji-btn" onclick="insertEmoji('🚨')">🚨</button>
                <button class="emoji-btn" onclick="insertEmoji('🛞')">🛞</button>
            </div>

            <div class="emoji-category-title">Nástroje & Garáž</div>
            <div class="emoji-grid">
                <button class="emoji-btn" onclick="insertEmoji('🔧')">🔧</button>
                <button class="emoji-btn" onclick="insertEmoji('🔨')">🔨</button>
                <button class="emoji-btn" onclick="insertEmoji('⚙️')">⚙️</button>
                <button class="emoji-btn" onclick="insertEmoji('🔑')">🔑</button>
                <button class="emoji-btn" onclick="insertEmoji('🧰')">🧰</button>
                <button class="emoji-btn" onclick="insertEmoji('💡')">💡</button>
                <button class="emoji-btn" onclick="insertEmoji('⭐')">⭐</button>
                <button class="emoji-btn" onclick="insertEmoji('🔥')">🔥</button>
            </div>

            <div class="emoji-category-title">Peníze & Předměty</div>
            <div class="emoji-grid">
                <button class="emoji-btn" onclick="insertEmoji('💰')">💰</button>
                <button class="emoji-btn" onclick="insertEmoji('💵')">💵</button>
                <button class="emoji-btn" onclick="insertEmoji('💳')">💳</button>
                <button class="emoji-btn" onclick="insertEmoji('📦')">📦</button>
                <button class="emoji-btn" onclick="insertEmoji('💻')">💻</button>
                <button class="emoji-btn" onclick="insertEmoji('📱')">📱</button>
                <button class="emoji-btn" onclick="insertEmoji('⌚')">⌚</button>
                <button class="emoji-btn" onclick="insertEmoji('🏆')">🏆</button>
            </div>

            <div class="emoji-category-title">Smajlíci & Reakce</div>
            <div class="emoji-grid">
                <button class="emoji-btn" onclick="insertEmoji('😀')">😀</button>
                <button class="emoji-btn" onclick="insertEmoji('😎')">😎</button>
                <button class="emoji-btn" onclick="insertEmoji('🤔')">🤔</button>
                <button class="emoji-btn" onclick="insertEmoji('👍')">👍</button>
                <button class="emoji-btn" onclick="insertEmoji('✅')">✅</button>
                <button class="emoji-btn" onclick="insertEmoji('❌')">❌</button>
                <button class="emoji-btn" onclick="insertEmoji('⚠️')">⚠️</button>
                <button class="emoji-btn" onclick="insertEmoji('💀')">💀</button>
            </div>
        </div>
    </div>

    <script>
        let appData = {
            "obecne": {
                "prehled": {
                    "vitr": { content: "Vítejte! Nyní můžete měnit názvy složek i pláten a posouvat jejich pozici.", x: 50, y: 50, width: "320px", height: "220px" }
                }
            }
        };
        let activeChannel = "obecne";
        let activeCanvasTab = "prehled";
        let activeEditorElement = null;

        let binId = localStorage.getItem("chicano_bin_id") || "";
        let apiKey = localStorage.getItem("chicano_api_key") || "";

        window.onload = function() {
            document.getElementById('binIdInput').value = binId;
            document.getElementById('apiKeyInput').value = apiKey;

            if (binId && apiKey) {
                fetchFromCloud();
            } else {
                renderApp();
            }
        };

        function toggleEmojiSidebar() {
            document.getElementById('emojiSidebar').classList.toggle('hidden');
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Chyba při přepnutí do fullscreenu: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function insertEmoji(emoji) {
            if (!activeEditorElement) {
                alert("Nejprve klikněte do některého plovoucího okna, kam chcete emoji vložit!");
                return;
            }
            activeEditorElement.focus();
            
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                const range = selection.getRangeAt(0);
                range.deleteContents();
                range.insertNode(document.createTextNode(emoji));
                range.collapse(false);
                selection.removeAllRanges();
                selection.addRange(range);
            } else {
                activeEditorElement.innerHTML += emoji;
            }
            triggerUpdate(activeEditorElement.dataset.windowName);
        }

        function saveCloudConfig() {
            binId = document.getElementById('binIdInput').value.trim();
            apiKey = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem("chicano_bin_id", binId);
            localStorage.setItem("chicano_api_key", apiKey);
            alert("Klíče uloženy!");
            fetchFromCloud();
        }

        async function fetchFromCloud() {
            if (!binId || !apiKey) {
                alert("Nejprve vyplň Bin ID a API Key!");
                return;
            }
            document.getElementById('syncStatus').innerText = "Stahuji z cloudu...";
            try {
                const response = `https://api.jsonbin.io/v3/b/${binId}/latest`;
                const res = await fetch(response, {
                    headers: { 'X-Master-Key': apiKey }
                });
                if (!res.ok) throw new Error("Chyba při stahování");
                const resData = await res.json();
                
                let rawData = resData.record;
                let migratedData = {};
                for (let ch in rawData) {
                    migratedData[ch] = {};
                    let firstVal = rawData[ch][Object.keys(rawData[ch])[0]];
                    if (firstVal && firstVal.content !== undefined && firstVal.x !== undefined) {
                        migratedData[ch]["hlavni"] = rawData[ch];
                    } else {
                        migratedData[ch] = rawData[ch];
                    }
                }
                appData = migratedData;
                
                const channels = Object.keys(appData);
                if (channels.length > 0 && !appData[activeChannel]) {
                    activeChannel = channels[0];
                }
                if (appData[activeChannel]) {
                    const canvasTabs = Object.keys(appData[activeChannel]);
                    if (canvasTabs.length > 0 && !appData[activeChannel][activeCanvasTab]) {
                        activeCanvasTab = canvasTabs[0];
                    }
                }
                renderApp();
                document.getElementById('syncStatus').innerText = "Cloud: Synchronizováno ✓";
            } catch (e) {
                console.error(e);
                document.getElementById('syncStatus').innerText = "Cloud: Chyba připojení ❌";
            }
        }

        let saveTimeout;
        function saveToCloud() {
            if (!binId || !apiKey) return;
            document.getElementById('syncStatus').innerText = "Ukládám do cloudu...";
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': apiKey
                        },
                        body: JSON.stringify(appData)
                    });
                    if (!response.ok) throw new Error("Chyba při uložení");
                    document.getElementById('syncStatus').innerText = "Cloud: Uloženo ✓";
                } catch (e) {
                    console.error(e);
                    document.getElementById('syncStatus').innerText = "Cloud: Chyba při ukládání ❌";
                }
            }, 1000);
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "chicano_notes_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importBackup(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        appData = JSON.parse(e.target.result);
                        const channels = Object.keys(appData);
                        if (channels.length > 0) activeChannel = channels[0];
                        if (appData[activeChannel]) {
                            const tabs = Object.keys(appData[activeChannel]);
                            if (tabs.length > 0) activeCanvasTab = tabs[0];
                        }
                        renderApp();
                        saveToCloud();
                        alert("Záloha byla úspěšně nahrána!");
                    } catch (err) {
                        alert("Neplatný JSON soubor!");
                    }
                };
            }
        }

        function formatText(command, value = null) {
            if (!activeEditorElement) {
                alert("Nejprve klikněte do okna, které chcete formátovat!");
                return;
            }
            document.execCommand(command, false, value);
            activeEditorElement.focus();
            triggerUpdate(activeEditorElement.dataset.windowName);
        }

        function changeFontSize(size) {
            if (!activeEditorElement) return;
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            
            const range = selection.getRangeAt(0);
            if (range.collapsed) {
                alert("Nejprve označ myší text nebo emoji, které chceš zvětšit!");
                return;
            }

            const span = document.createElement('span');
            span.style.fontSize = size;
            span.appendChild(range.extractContents());
            range.insertNode(span);
            
            activeEditorElement.focus();
            triggerUpdate(activeEditorElement.dataset.windowName);
        }

        function addChannel() {
            const nameInput = document.getElementById('newChannelName');
            let name = nameInput.value.trim().toLowerCase().replace(/\s+/g, '-');
            if (!name) return;
            if (appData[name]) {
                alert("Složka s tímto názvem již existuje!");
                return;
            }
            appData[name] = { "prehled": {} };
            activeChannel = name;
            activeCanvasTab = "prehled";
            nameInput.value = "";
            renderApp();
            saveToCloud();
        }

        function selectChannel(name) {
            activeChannel = name;
            const canvasTabs = Object.keys(appData[activeChannel]);
            if (canvasTabs.length > 0) {
                activeCanvasTab = canvasTabs[0];
            } else {
                activeCanvasTab = "";
            }
            renderApp();
        }

        function deleteChannel(e, name) {
            e.stopPropagation();
            if (Object.keys(appData).length <= 1) return;
            if (confirm(`Opravdu smazat složku #${name}?`)) {
                delete appData[name];
                const channels = Object.keys(appData);
                activeChannel = channels[0];
                const tabs = Object.keys(appData[activeChannel]);
                activeCanvasTab = tabs.length > 0 ? tabs[0] : "";
                renderApp();
                saveToCloud();
            }
        }

        function renameChannel(oldName) {
            let newName = prompt("Zadej nový název složky:", oldName);
            if (!newName) return;
            newName = newName.trim().toLowerCase().replace(/\s+/g, '-');
            if (newName === oldName) return;
            if (appData[newName]) {
                alert("Složka s tímto názvem již existuje!");
                return;
            }

            let oldObj = appData;
            let newObj = {};
            for (let key in oldObj) {
                if (key === oldName) {
                    newObj[newName] = oldObj[oldName];
                } else {
                    newObj[key] = oldObj[key];
                }
            }
            appData = newObj;
            if (activeChannel === oldName) {
                activeChannel = newName;
            }
            renderApp();
            saveToCloud();
        }

        function moveChannel(channelName, direction) {
            let keys = Object.keys(appData);
            let index = keys.indexOf(channelName);
            if (index === -1) return;

            let targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= keys.length) return;

            let temp = keys[index];
            keys[index] = keys[targetIndex];
            keys[targetIndex] = temp;

            let reorderedObj = {};
            keys.forEach(k => {
                reorderedObj[k] = appData[k];
            });
            appData = reorderedObj;

            renderApp();
            saveToCloud();
        }

        function addCanvasTab() {
            const input = document.getElementById('newCanvasTabName');
            let tabName = input.value.trim();
            if (!tabName) return;
            if (!appData[activeChannel]) appData[activeChannel] = {};
            if (appData[activeChannel][tabName]) {
                alert("Plátno s tímto názvem již existuje!");
                return;
            }
            appData[activeChannel][tabName] = {};
            activeCanvasTab = tabName;
            input.value = "";
            renderApp();
            saveToCloud();
        }

        function selectCanvasTab(tabName) {
            activeCanvasTab = tabName;
            renderApp();
        }

        function deleteCanvasTab(e, tabName) {
            e.stopPropagation();
            if (Object.keys(appData[activeChannel]).length <= 1) {
                alert("Složka musí obsahovat alespoň jedno plátno!");
                return;
            }
            if (confirm(`Opravdu smazat plátno ${tabName}?`)) {
                delete appData[activeChannel][tabName];
                const tabs = Object.keys(appData[activeChannel]);
                activeCanvasTab = tabs[0];
                renderApp();
                saveToCloud();
            }
        }

        function renameCanvasTab(oldName) {
            let newName = prompt("Zadej nový název plátna:", oldName);
            if (!newName) return;
            newName = newName.trim();
            if (newName === oldName) return;
            if (appData[activeChannel][newName]) {
                alert("Plátno s tímto názvem již existuje!");
                return;
            }

            let oldObj = appData[activeChannel];
            let newObj = {};
            for (let key in oldObj) {
                if (key === oldName) {
                    newObj[newName] = oldObj[oldName];
                } else {
                    newObj[key] = oldObj[key];
                }
            }
            appData[activeChannel] = newObj;
            if (activeCanvasTab === oldName) {
                activeCanvasTab = newName;
            }
            renderApp();
            saveToCloud();
        }

        function moveCanvasTab(tabName, direction) {
            let keys = Object.keys(appData[activeChannel]);
            let index = keys.indexOf(tabName);
            if (index === -1) return;

            let targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= keys.length) return;

            let temp = keys[index];
            keys[index] = keys[targetIndex];
            keys[targetIndex] = temp;

            let reorderedObj = {};
            keys.forEach(k => {
                reorderedObj[k] = appData[activeChannel][k];
            });
            appData[activeChannel] = reorderedObj;

            renderApp();
            saveToCloud();
        }

        function addFloatingWindow() {
            const input = document.getElementById('newWindowName');
            let winName = input.value.trim();
            if (!winName) return;
            if (!appData[activeChannel]) appData[activeChannel] = {};
            if (!appData[activeChannel][activeCanvasTab]) appData[activeChannel][activeCanvasTab] = {};

            if (appData[activeChannel][activeCanvasTab][winName]) {
                alert("Okno s tímto názvem již na plátně existuje!");
                return;
            }

            appData[activeChannel][activeCanvasTab][winName] = {
                content: "",
                x: 100 + Math.random() * 50,
                y: 100 + Math.random() * 50,
                width: "300px",
                height: "200px"
            };

            input.value = "";
            renderApp();
            saveToCloud();
        }

        function deleteFloatingWindow(winName) {
            if (confirm(`Zavřít okno ${winName}?`)) {
                delete appData[activeChannel][activeCanvasTab][winName];
                renderApp();
                saveToCloud();
            }
        }

        function triggerUpdate(winName) {
            const winEl = document.querySelector(`.window-body[data-window-name="${winName}"]`);
            if (winEl && appData[activeChannel] && appData[activeChannel][activeCanvasTab] && appData[activeChannel][activeCanvasTab][winName]) {
                appData[activeChannel][activeCanvasTab][winName].content = winEl.innerHTML;
                saveToCloud();
            }
        }

        function renderApp() {
            const listEl = document.getElementById('channelList');
            listEl.innerHTML = '';

            let channelKeys = Object.keys(appData);
            channelKeys.forEach((channel, idx) => {
                const item = document.createElement('div');
                item.className = `channel-item ${channel === activeChannel ? 'active' : ''}`;
                const canDelete = channelKeys.length > 1;

                item.innerHTML = `
                    <span># ${channel}</span>
                    <div class="channel-actions">
                        <button class="channel-btn" onclick="event.stopPropagation(); renameChannel('${channel}')" title="Přejmenovat složku">✏️</button>
                        ${idx > 0 ? `<button class="channel-btn" onclick="event.stopPropagation(); moveChannel('${channel}', -1)" title="Posunout nahoru">▲</button>` : ''}
                        ${idx < channelKeys.length - 1 ? `<button class="channel-btn" onclick="event.stopPropagation(); moveChannel('${channel}', 1)" title="Posunout dolů">▼</button>` : ''}
                        ${canDelete ? `<button class="channel-btn delete-btn" onclick="deleteChannel(event, '${channel}')" title="Smazat složku">✕</button>` : ''}
                    </div>
                `;
                item.onclick = (e) => {
                    if (e.target.tagName !== 'BUTTON') selectChannel(channel);
                };
                listEl.appendChild(item);
            });

            document.getElementById('currentChannelTitle').innerText = "# " + activeChannel;

            const tabsBar = document.getElementById('tabsBar');
            let canvasTabsHTML = '';
            if (appData[activeChannel]) {
                let keys = Object.keys(appData[activeChannel]);
                keys.forEach((canvasTab, idx) => {
                    const isActive = canvasTab === activeCanvasTab ? 'active' : '';
                    const canDelete = keys.length > 1;
                    
                    canvasTabsHTML += `
                        <div class="tab-item ${isActive}" onclick="selectCanvasTab('${canvasTab}')">
                            <span>📄 ${canvasTab}</span>
                            <button class="tab-btn" onclick="event.stopPropagation(); renameCanvasTab('${canvasTab}')" title="Přejmenovat plátno">✏️</button>
                            ${idx > 0 ? `<button class="tab-btn" onclick="event.stopPropagation(); moveCanvasTab('${canvasTab}', -1)" title="Posunout doleva">&lt;</button>` : ''}
                            ${idx < keys.length - 1 ? `<button class="tab-btn" onclick="event.stopPropagation(); moveCanvasTab('${canvasTab}', 1)" title="Posunout doprava">&gt;</button>` : ''}
                            ${canDelete ? `<button class="tab-btn delete-tab-btn" onclick="deleteCanvasTab(event, '${canvasTab}')" title="Smazat plátno">✕</button>` : ''}
                        </div>
                    `;
                });
            }

            tabsBar.innerHTML = `
                ${canvasTabsHTML}
                <div class="add-tab-box">
                    <input type="text" id="newCanvasTabName" placeholder="Nové plátno..." onkeypress="if(event.key === 'Enter') addCanvasTab()">
                    <button onclick="addCanvasTab()">＋ Plátno</button>
                </div>
            `;

            const canvas = document.getElementById('canvasArea');
            canvas.innerHTML = '';

            if (appData[activeChannel] && appData[activeChannel][activeCanvasTab]) {
                let windowsObj = appData[activeChannel][activeCanvasTab];
                for (let winName in windowsObj) {
                    let winData = windowsObj[winName];
                    if (typeof winData === 'string') {
                        winData = { content: winData, x: 50, y: 50, width: "300px", height: "200px" };
                        windowsObj[winName] = winData;
                    }

                    const win = document.createElement('div');
                    win.className = 'floating-window';
                    win.style.left = (winData.x || 50) + 'px';
                    win.style.top = (winData.y || 50) + 'px';
                    win.style.width = winData.width || '300px';
                    win.style.height = winData.height || '200px';

                    win.innerHTML = `
                        <div class="window-header">
                            <span class="window-title">${winName}</span>
                            <div class="window-controls">
                                <button class="window-btn delete" onclick="deleteFloatingWindow('${winName}')" title="Zavřít okno">✕</button>
                            </div>
                        </div>
                        <div class="window-body" contenteditable="true" data-window-name="${winName}">${winData.content || ""}</div>
                    `;

                    const bodyEl = win.querySelector('.window-body');
                    bodyEl.oninput = () => triggerUpdate(winName);
                    bodyEl.onfocus = () => {
                        document.querySelectorAll('.floating-window').forEach(w => w.classList.remove('active-window'));
                        win.classList.add('active-window');
                        activeEditorElement = bodyEl;
                    };

                    const headerEl = win.querySelector('.window-header');
                    headerEl.onmousedown = (e) => {
                        if (e.target.tagName === 'BUTTON') return;
                        document.querySelectorAll('.floating-window').forEach(w => w.classList.remove('active-window'));
                        win.classList.add('active-window');
                        activeEditorElement = bodyEl;

                        let startX = e.clientX;
                        let startY = e.clientY;
                        let rect = win.getBoundingClientRect();
                        let canvasRect = canvas.getBoundingClientRect();

                        let initialLeft = rect.left - canvasRect.left;
                        let initialTop = rect.top - canvasRect.top;

                        function onMouseMove(moveEvent) {
                            let dx = moveEvent.clientX - startX;
                            let dy = moveEvent.clientY - startY;
                            win.style.left = (initialLeft + dx) + 'px';
                            win.style.top = (initialTop + dy) + 'px';
                        }

                        function onMouseUp() {
                            window.removeEventListener('mousemove', onMouseMove);
                            window.removeEventListener('mouseup', onMouseUp);

                            winData.x = parseInt(win.style.left);
                            winData.y = parseInt(win.style.top);
                            saveToCloud();
                        }

                        window.addEventListener('mousemove', onMouseMove);
                        window.addEventListener('mouseup', onMouseUp);
                    };

                    const resizeObserver = new ResizeObserver(entries => {
                        for (let entry of entries) {
                            winData.width = entry.target.style.width;
                            winData.height = entry.target.style.height;
                            saveToCloud();
                        }
                    });
                    resizeObserver.observe(win);

                    canvas.appendChild(win);
                }
            }
        }
    </script>
</body>
</html>
