        async function processAndVerifyToken(accessToken) {
            try {
                const userRes = await fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${accessToken}` }
                });
                if (!userRes.ok) return false;
                const userData = await userRes.json();

                const memberRes = await fetch(`https://discord.com/api/users/@me/guilds/${DISCORD_GUILD_ID}/member`, {
                    headers: { authorization: `Bearer ${accessToken}` }
                });

                let hasAccess = false;
                let isAdmin = false;
                let isSecretario = false;
                let isServerAdmin = false;

                if (memberRes.ok) {
                    const memberData = await memberRes.json();
                    if (memberData && memberData.roles) {
                        const hasMiembro = memberData.roles.includes(MIEMBRO_ROLE);
                        const hasAdminRole = memberData.roles.some(roleId => ADMIN_ROLES.includes(roleId));
                        const hasSecretarioRole = memberData.roles.includes(SECRETARIO_ROLE);
                        const hasServerAdminRole = memberData.roles.includes(SERVER_ADMIN_ROLE);

                        if (hasServerAdminRole) {
                            hasAccess = true;
                            isServerAdmin = true;
                        } else if (hasMiembro || hasAdminRole || hasSecretarioRole) {
                            hasAccess = true;
                            if (hasAdminRole) {
                                isAdmin = true;
                            } else if (hasSecretarioRole) {
                                isSecretario = true;
                            }
                        }
                    }
                }

                state.discordUser = userData.username;
                state.isAuthenticated = true;
                state.hasAccess = hasAccess;
                state.isAdmin = isAdmin;
                state.isSecretario = isSecretario;
                state.isServerAdmin = isServerAdmin;

                const sessionData = {
                    isAuthenticated: true,
                    hasAccess: hasAccess,
                    isAdmin: isAdmin,
                    isSecretario: isSecretario,
                    isServerAdmin: isServerAdmin,
                    discordUser: userData.username,
                    token: accessToken
                };
                localStorage.setItem('pager_user_session', JSON.stringify(sessionData));
                return true;
            } catch (e) {
                return false;
            }
        }

        async function loadSessionFromStorage() {
            const saved = localStorage.getItem('pager_user_session');
            if (!saved) return false;
            
            try {
                const data = JSON.parse(saved);
                if (!data.token) return false;

                const success = await processAndVerifyToken(data.token);
                if (!success) {
                    localStorage.removeItem('pager_user_session');
                    return false;
                }
                return true;
            } catch(e) {
                localStorage.removeItem('pager_user_session');
                return false;
            }
        }

            if (!supabaseClient || state.isServerAdmin) return;
            try {
                let { data: chatData } = await supabaseClient.from('chat').select('*').order('created_at', { ascending: true });
                if (chatData) {
                    const newMessages = chatData.map(m => ({
                        id: m.id, sender: m.sender, text: m.text,
                        time: new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        isAdmin: m.is_admin
                    }));
                    
                    if (newMessages.length !== chatMessages.length || JSON.stringify(newMessages) !== JSON.stringify(chatMessages)) {
                        chatMessages = newMessages;
                        if (shouldRender && state.hasAccess && openedTab === 'livechat') {
                            const activeInput = document.getElementById('chatInputField');
                            const savedText = activeInput ? activeInput.value : "";

                            render();
                            scrollToBottomChat();

                            const restoredInput = document.getElementById('chatInputField');
                            if (restoredInput && savedText) {
                                restoredInput.value = savedText;
                                restoredInput.focus();
                                restoredInput.setSelectionRange(restoredInput.value.length, restoredInput.value.length);
                            }
                        }
                    }
                }
            } catch (err) { console.error("Chyba při načítání chatu:", err); }
        }

        async function loadCloudData() {
            await checkDiscordAuth();

            if (!state.isAuthenticated) {
                await loadSessionFromStorage();
            }

            if (!supabaseClient) { render(); return; }
            try {
                let { data: appData } = await supabaseClient.from('app_data').select('data').eq('key', 'main_state').single();
                if (appData && appData.data) {
                    const cloudState = appData.data;
                    state.zamestnanci = cloudState.zamestnanci || state.zamestnanci;
                    state.oznameni = cloudState.oznameni || state.oznameni;
                    state.info = cloudState.info || state.info;
                    state.kaple = cloudState.kaple || state.kaple;
                    state.parking = cloudState.parking || state.parking;
                    state.pujcky = cloudState.pujcky || state.pujcky;
                    state.pokuty = cloudState.pokuty || state.pokuty;
                    state.kontakty = cloudState.kontakty || state.kontakty;
                    state.currentFreq = cloudState.currentFreq || state.currentFreq;
                }
                
                if (!state.isServerAdmin) {
                    await fetchChatMessages(false);
                    
                    supabaseClient.channel('public:chat')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat' }, payload => {
                            const m = payload.new;
                            if (!chatMessages.some(e => e.id === m.id)) {
                                chatMessages.push({
                                    id: m.id, sender: m.sender, text: m.text,
                                    time: new Date(m.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                                    isAdmin: m.is_admin
                                });
                                if (state.hasAccess && openedTab === 'livechat') {
                                    const activeInput = document.getElementById('chatInputField');
                                    const savedText = activeInput ? activeInput.value : "";

                                    render();
                                    scrollToBottomChat();

                                    const restoredInput = document.getElementById('chatInputField');
                                    if (restoredInput && savedText) {
                                        restoredInput.value = savedText;
                                        restoredInput.focus();
                                        restoredInput.setSelectionRange(restoredInput.value.length, restoredInput.value.length);
                                    }
                                }
                            }
                        })
                        .subscribe();
                }

                supabaseClient.channel('public:app_data')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_data' }, payload => {
                        if (payload.new && payload.new.key === 'main_state' && payload.new.data) {
                            const cloudState = payload.new.data;
                            state.zamestnanci = cloudState.zamestnanci || state.zamestnanci;
                            state.oznameni = cloudState.oznameni || state.oznameni;
                            state.info = cloudState.info || state.info;
                            state.kaple = cloudState.kaple || state.kaple;
                            state.parking = cloudState.parking || state.parking;
                            state.pujcky = cloudState.pujcky || state.pujcky;
                            state.pokuty = cloudState.pokuty || state.pokuty;
                            state.kontakty = cloudState.kontakty || state.kontakty;
                            state.currentFreq = cloudState.currentFreq || state.currentFreq;
                            render();
                        }
                    })
                    .subscribe();

                document.getElementById('cloudStatus').innerText = "SYNCHRONIZACE: LIVE (ONLINE)";
            } catch (err) {
                document.getElementById('cloudStatus').innerText = "SYNCHRONIZACE: LOKÁLNÍ REŽIM";
            }
            render();
        }

        setInterval(() => {
            if (state.hasAccess && openedTab === 'livechat' && !state.isServerAdmin) {
                fetchChatMessages(true);
            }
        }, 5000);

        async function saveCloudState() {
            if (!supabaseClient || !state.hasAccess || state.isServerAdmin) return;
            try {
                await supabaseClient.from('app_data').upsert({ key: 'main_state', data: state });
            } catch (err) { console.error("Chyba při ukládání do DB:", err); }
        }

        function getCurrentAuthorName() {
            const savedNick = localStorage.getItem('pager_custom_ic_nick');
            if (savedNick) return savedNick;
            if (loggedInMemberId) {
                let emp = state.zamestnanci.find(e => e.id === Number(loggedInMemberId));
                if (emp && emp.name) return emp.name;
            }
            return state.isServerAdmin ? "Server Admin (Dozor)" : "Neznámý člen";
        }

        function saveCustomIcNickname() {
            if (state.isServerAdmin) return;
            const input = document.getElementById('customNickInput');
            if (!input || !input.value.trim()) return;
            const newNick = input.value.trim();
            
            localStorage.setItem('pager_custom_ic_nick', newNick);
            render();
            alert("IC přezdívka byla úspěšně trvale uložena!");
        }

        async function sendChatMessage() {
            if (!state.hasAccess || state.isServerAdmin) return;
            const input = document.getElementById('chatInputField');
            if (!input || !input.value.trim()) return;
            const textVal = input.value.trim();
            input.value = "";
            
            let senderName = getCurrentAuthorName();

            if (supabaseClient) {
                await supabaseClient.from('chat').insert([{ sender: senderName, text: textVal, is_admin: state.isAdmin }]);
            }
            
            sendWebhookMessage(`💬 **[IC Pager Chat]** \`${senderName}\`: ${textVal}`);
            playBeep(850, 0.05, 'triangle');
        }

        function scrollToBottomChat() {
            const container = document.getElementById('chatMessagesContainer');
            if (container) container.scrollTop = container.scrollHeight;
        }

        function createOrLoginMember() {
            if (!state.hasAccess || state.isServerAdmin) return;
            const nameInput = document.getElementById('newMemberNameInput');
            if (!nameInput || !nameInput.value.trim()) return;
            const memberName = nameInput.value.trim();

            let existingEmp = state.zamestnanci.find(e => e.name.toLowerCase() === memberName.toLowerCase());
            
            if (existingEmp) {
                loggedInMemberId = existingEmp.id;
                selectedEmployeeId = existingEmp.id;
            } else {
                const newId = Date.now();
                const newFolder = {
                    id: newId,
                    name: memberName,
                    phone: "",
                    bank: "",
                    zaznamy: []
                };
                state.zamestnanci.push(newFolder);
                loggedInMemberId = newId;
                selectedEmployeeId = newId;
                saveCloudState();
            }
            render();
        }

        function saveEmployeeDetails() {
            if (!state.hasAccess || state.isServerAdmin || selectedEmployeeId === null) return;
            let emp = state.zamestnanci.find(e => e.id === Number(selectedEmployeeId));
            if (!emp) return;

            const phone = document.getElementById('edit_emp_phone')?.value;
            const bank = document.getElementById('edit_emp_bank')?.value;
            if (phone !== undefined) emp.phone = phone;
            if (bank !== undefined) emp.bank = bank;

            saveCloudState();
            render();
        }

        function deleteEmployee(id) {
            if (!state.isAdmin) return;
            state.zamestnanci = state.zamestnanci.filter(e => e.id !== id);
            if (selectedEmployeeId === id) selectedEmployeeId = null;
            saveCloudState();
            render();
        }

        function addZaznamToEmployee(empId) {
            if (!state.hasAccess || state.isServerAdmin) return;
            const title = document.getElementById('zaznam_title').value;
            const proofUrl = document.getElementById('zaznam_proof').value;
            if (!title) return;

            let emp = state.zamestnanci.find(e => e.id === empId);
            if (emp) {
                if (!emp.zaznamy) emp.zaznamy = [];
                emp.zaznamy.push({ id: Date.now(), title, proofUrl });
                saveCloudState();
                render();
            }
        }

        function deleteZaznam(empId, zaznamId) {
            if (!state.hasAccess || state.isServerAdmin) return;
            let emp = state.zamestnanci.find(e => e.id === empId);
            if (emp) {
                let currentAuthor = getCurrentAuthorName();
                emp.zaznamy = emp.zaznamy.filter(z => {
                    if (z.id === zaznamId) {
                        return state.isAdmin || z.author === currentAuthor;
                    }
                    return true;
                });
                saveCloudState();
                render();
            }
        }

        function startEditing(category, id) {
            if (!state.hasAccess || state.isServerAdmin) return;
            editingItemId = id;
            render();
        }

        function cancelEditing() {
            editingItemId = null;
            render();
        }

        function saveItem(category) {
            if (!state.hasAccess || state.isServerAdmin) return;
            const author = getCurrentAuthorName();
            
            if (category === 'oznameni') {
                if (!state.isAdmin) return;
                const title = document.getElementById('ann_title').value;
                const text = document.getElementById('ann_text').value;
                if (!title || !text) return;
                if (editingItemId) {
                    let item = state.oznameni.find(i => i.id === editingItemId);
                    if (item) { item.title = title; item.text = text; }
                } else {
                    state.oznameni.push({ id: Date.now(), author, title, text });
                    state.hasUnreadAnnouncements = true;
                }
            } else if (category === 'info') {
                const title = document.getElementById('info_title').value;
                const text = document.getElementById('info_text').value;
                if (!title || !text) return;
                if (editingItemId) {
                    let item = state.info.find(i => i.id === editingItemId);
                    if (item && (state.isAdmin || item.author === author)) { 
                        item.title = title; 
                        item.text = text; 
                    }
                } else {
                    state.info.push({ id: Date.now(), author, title, text });
                }
            } else if (category === 'kaple') {
                if (!state.isAdmin && !state.isSecretario) return;
                const title = document.getElementById('kaple_title').value;
                const text = document.getElementById('kaple_text').value;
                if (!title || !text) return;
                if (editingItemId) {
                    let item = state.kaple.find(i => i.id === editingItemId);
                    if (item) { item.title = title; item.text = text; }
                } else {
                    state.kaple.push({ id: Date.now(), author, title, text });
                }
            } else if (category === 'parking') {
                if (!state.isAdmin) return;
                const rank = document.getElementById('park_rank').value;
                const spot = document.getElementById('park_spot').value;
                if (!rank || !spot) return;
                if (editingItemId) {
                    let item = state.parking.find(i => i.id === editingItemId);
                    if (item) { item.rank = rank; item.spot = spot; }
                } else {
                    state.parking.push({ id: Date.now(), author, rank, spot });
                }
            } else if (category === 'pujcky') {
                if (!state.isAdmin) return; 
                const debtor = document.getElementById('loan_debtor').value;
                const amount = document.getElementById('loan_amount').value;
                const note = document.getElementById('loan_note')?.value || '';
                if (!debtor || !amount) return;
                if (editingItemId) {
                    let item = state.pujcky.find(i => i.id === editingItemId);
                    if (item) { item.debtor = debtor; item.amount = amount; item.note = note; }
                } else {
                    state.pujcky.push({ id: Date.now(), author, debtor, amount, note });
                }
            } else if (category === 'pokuty') {
                if (!state.isAdmin) return; 
                const member = document.getElementById('fine_member').value;
                const amount = document.getElementById('fine_amount').value;
                const reason = document.getElementById('fine_reason')?.value || '';
                if (!member || !amount) return;
                if (editingItemId) {
                    let item = state.pokuty.find(i => i.id === editingItemId);
                    if (item) { item.member = member; item.amount = amount; item.reason = reason; }
                } else {
                    state.pokuty.push({ id: Date.now(), author, member, amount, reason });
                }
            } else if (category === 'kontakty') {
                const name = document.getElementById('contact_name').value;
                const phone = document.getElementById('contact_phone').value;
                const note = document.getElementById('contact_note')?.value || '';
                if (!name || !phone) return;
                if (editingItemId) {
                    let item = state.kontakty.find(i => i.id === editingItemId);
                    if (item && (state.isAdmin || item.author === author)) { item.name = name; item.phone = phone; item.note = note; }
                } else {
                    state.kontakty.push({ id: Date.now(), author, name, phone, note });
                }
            }
            editingItemId = null;
            saveCloudState();
            render();
        }

        function deleteItem(category, id) {
            if (!state.hasAccess || state.isServerAdmin) return;
            let item = state[category].find(i => i.id === id);
            if (!item) return;

            let author = getCurrentAuthorName();

            if (category === 'parking' && !state.isAdmin) return;
            if (category === 'kaple' && !state.isAdmin && !state.isSecretario) return;
            if (category === 'pujcky' && !state.isAdmin) return;
            if (category === 'pokuty' && !state.isAdmin) return;
            if (category === 'oznameni' && !state.isAdmin) return;
            if (category === 'info' && !state.isAdmin && item.author !== author) return;
            if (category === 'kontakty' && !state.isAdmin && item.author !== author) return;

            state[category] = state[category].filter(i => i.id !== id);
            saveCloudState();
            render();
        }

        function updateFrequency() {
            if (!state.hasAccess || state.isServerAdmin) return;
            const newFreq = document.getElementById('freqInput').value;
            if(!newFreq) return;
            state.currentFreq = newFreq;
            state.hasUnreadFreq = true;
            saveCloudState();
            render();
        }

        function updateUIState() {
            const btn = document.getElementById('dcRoleBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const flipBtn = document.getElementById('flipBtn');
            
            if (state.isAuthenticated) {
                logoutBtn.style.display = "flex";
            } else {
                logoutBtn.style.display = "none";
            }

            let icIdentityName = getCurrentAuthorName();

            if(state.isServerAdmin) {
                btn.innerHTML = `👁️ SERVER DOZOR [ADMIN]`;
                btn.classList.add('is-server-admin');
                btn.classList.remove('is-admin');
                flipBtn.style.display = "none";

                btn.innerHTML = `👑 VEDENÍ [${icIdentityName}]`;
                btn.classList.add('is-admin');
                btn.classList.remove('is-server-admin');
                flipBtn.style.display = "flex";

                btn.innerHTML = `📋 SECRETARIO [${icIdentityName}]`;
                btn.classList.add('is-admin');
                btn.classList.remove('is-server-admin');
                flipBtn.style.display = "none";

                btn.innerHTML = `👤 ${icIdentityName.toUpperCase()} [PŘIPOJENO]`;
                btn.classList.remove('is-admin');
                btn.classList.remove('is-server-admin');
                flipBtn.style.display = "none";

                btn.innerHTML = `📡 PŘIPOJIT K SÍTI`;
                btn.classList.remove('is-admin');
                btn.classList.remove('is-server-admin');
                flipBtn.style.display = "none";

        function navigateMenu(direction) {
            if (!state.hasAccess || openedTab !== null || isFlipped || activeModalImage !== null) return;
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = tabsList.length - 1;
            if (currentIndex >= tabsList.length) currentIndex = 0;
            render();
            
            const bodyEl = document.getElementById('screenBody');
            const focusedEl = bodyEl.querySelector('.menu-item-row.focused');
            if (focusedEl) {
                focusedEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function openSelectedTab() {
            if (!state.hasAccess) return;
            if (activeModalImage !== null) { closeImageModal(); return; }
            if (openedTab !== null || isFlipped) return;
            
            const selectedTabId = tabsList[currentIndex].id;

            if (state.isServerAdmin && (selectedTabId === 'livechat' || selectedTabId === 'kaple' || selectedTabId === 'pujcky' || selectedTabId === 'pokuty')) {
                playBeep(300, 0.1, 'sawtooth');
                return;
            }

            if (!state.isAdmin && (selectedTabId === 'pujcky' || selectedTabId === 'pokuty')) {
                playBeep(300, 0.1, 'sawtooth');
                alert("Nemáš oprávnění zobrazit tuto sekci (vyžadována role Vedení).");
                return;
            }

            openedTab = selectedTabId;
            editingItemId = null;
            selectedEmployeeId = null;
            if (openedTab === 'oznameni') state.hasUnreadAnnouncements = false;
            if (openedTab === 'freq') state.hasUnreadFreq = false;
            saveCloudState();
            render();
            if (openedTab === 'livechat' && !state.isServerAdmin) {
                fetchChatMessages(true);
            }
        }

        function goBackToMenu() {
            if (!state.hasAccess) return;
            if (activeModalImage !== null) { closeImageModal(); return; }
            if (isFlipped) { toggleFlip(); return; }
            
            if (openedTab === 'zamestnanci' && selectedEmployeeId !== null) {
                if (!state.isAdmin) {
                    loggedInMemberId = null;
                }
                selectedEmployeeId = null;
                render();
                return;
            }
            
            if (editingItemId !== null) { editingItemId = null; render(); return; }
            openedTab = null;
            render();
        }

        function toggleFlip() {
            if (!state.isAdmin) return;
            isFlipped = !isFlipped;
            const device = document.getElementById('pagerDevice');
            if (isFlipped) device.classList.add('is-flipped');
            else device.classList.remove('is-flipped');
            render();
        }

        function showImageModal(url) { activeModalImage = url; render(); }
        function closeImageModal() { activeModalImage = null; render(); }

        document.addEventListener('keydown', (e) => {
            if (!state.hasAccess) return;
            const activeTag = document.activeElement?.tagName;
            const isTyping = (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT');

            if (activeModalImage !== null) { if (e.key === 'Escape' || e.key === 'Enter') closeImageModal(); return; }
            if (isFlipped) { if (e.key === 'Escape') toggleFlip(); return; }
            if (openedTab === 'livechat' && document.activeElement?.id === 'chatInputField' && !state.isServerAdmin) {
                if (e.key === 'Enter') { sendChatMessage(); e.preventDefault(); }
                return;
            }
            if (isTyping) return;

            if (e.key === 'ArrowUp' && openedTab === null) { navigateMenu(-1); e.preventDefault(); }
            else if (e.key === 'ArrowDown' && openedTab === null) { navigateMenu(1); e.preventDefault(); }
            else if (e.key === 'Enter' && openedTab === null) { openSelectedTab(); e.preventDefault(); }
            else if (e.key === 'Backspace' || e.key === 'Escape') { goBackToMenu(); e.preventDefault(); }
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
            else if (document.exitFullscreen) document.exitFullscreen();
        }

                            Jsi přihlášen jako <b>Server Administrator</b> (externí kontrola). Citlivé interní RP kanály jsou pro tuto roli skryté.
                        </div>
                    </div>
                `;
            }

            if (activeModalImage !== null) {
                const modalDiv = document.createElement('div');
                modalDiv.id = 'imageModalOverlay';
                modalDiv.className = 'image-modal-overlay';
                modalDiv.innerHTML = `
                    <div class="image-modal-box">
                        <div style="font-size:13px; color:#f39c12; margin-bottom:8px; font-weight:bold;">NÁHLED DŮKAZU Z DISCORDU</div>
                        <img src="${activeModalImage}" alt="Důkaz" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x200?text=Obrázek+nelze+načíst';">
                        <button class="edit-action-btn save-action-btn" onclick="closeImageModal()" style="padding: 6px 16px;">ZAVŘÍT OKNO [OK]</button>
                    </div>
                `;
                screenContainer.appendChild(modalDiv);
                return;
            }

            if (isFlipped) {
                title.innerText = "> ADMIN PANEL";
                body.innerHTML = `<div>Admin servisní zóna. Můžeš spravovat záznamy.</div>`;
                return;
            }

            if (openedTab === null) {
                if (!state.isServerAdmin) {
                    title.innerText = "> HLAVNÍ MENU PAGERU";
                }
                let menuHTML = `<div style="font-size: 12px; color: #4a7542; margin-bottom: 8px;">VYBER POLOŽKU A STISKNI [OK]:</div>`;
                
                tabsList.forEach((t, idx) => {
                    if (state.isServerAdmin && (t.id === 'livechat' || t.id === 'kaple' || t.id === 'pujcky' || t.id === 'pokuty')) {
                        return;
                    }
                    if (!state.isAdmin && !state.isServerAdmin && (t.id === 'pujcky' || t.id === 'pokuty')) {
                        return;
                    }

                    let isFocused = (idx === currentIndex);
                    let marker = isFocused ? "▶ [ZVOLENO]" : "   ";
                    let redDotHTML = "";
                    if (t.id === 'oznameni' && state.hasUnreadAnnouncements) redDotHTML = `<span class="red-dot"></span>`;
                    if (t.id === 'freq' && state.hasUnreadFreq) redDotHTML = `<span class="red-dot"></span>`;

                    menuHTML += `<div class="menu-item-row ${isFocused ? 'focused' : ''}" onclick="currentIndex=${idx}; openSelectedTab();">
                        <span>${marker} ${t.name} ${redDotHTML}</span>
                    </div>`;
                });

                body.innerHTML = menuHTML;
            } 
            else {
                let currentTabObj = tabsList.find(t => t.id === openedTab);
                title.innerText = `> ${currentTabObj.name.toUpperCase()}`;
                let contentHTML = "";

                if (openedTab === 'livechat') {
                    if (state.isServerAdmin) {
                        contentHTML += `<div style="color:#ff6b81; font-weight:bold; text-align:center; padding:30px;">[ ✕ ] ZABEZPEČENÝ KANÁL</div>`;
                    } else {
                        contentHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                            <span style="font-size:11px; color:#8e9297;">Odesíláno pod tvojí IC přezdívkou</span>
                            <button class="edit-action-btn save-action-btn" onclick="fetchChatMessages(true); scrollToBottomChat();" style="font-size:10px; padding:3px 8px;">[🔄 OBNOVIT CHAT]</button>
                        </div>`;
                        contentHTML += `<div id="chatMessagesContainer" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:8px;">`;
                        chatMessages.forEach(msg => {
                            contentHTML += `<div class="chat-message ${msg.isAdmin ? 'admin-msg' : ''}"><div class="chat-sender"><span>${msg.sender}</span><span class="chat-time">${msg.time}</span></div><div>${msg.text}</div></div>`;
                        });
                        contentHTML += `</div><div class="chat-input-box"><input type="text" id="chatInputField" class="chat-input" placeholder="Napiš zprávu..." autocomplete="off"><button class="hw-btn ok-btn" onclick="sendChatMessage()" style="height:38px;">ODESLAT</button></div>`;
                    }
                }
                else if (openedTab === 'nastaveni_nicku') {
                    const currentNick = localStorage.getItem('pager_custom_ic_nick') || getCurrentAuthorName();
                    contentHTML += `
                        <div class="terminal-card">
                            <div class="terminal-title">✏️ TRVALÉ NASTAVENÍ IC PŘEZDÍVKY</div>
                            <div style="font-size: 13px; margin-bottom: 8px; color: #a3e635;">Aktuálně vystupuješ jako: <b>${currentNick}</b></div>
                            <div style="font-size: 12px; margin-bottom: 10px; color: #8e9297;">Zadej svou novou IC přezdívku:</div>
                            <input type="text" id="customNickInput" class="pager-edit-input" placeholder="Např. John Miller" value="${currentNick !== 'Neznámý člen' ? currentNick : ''}" style="margin-bottom: 10px;" autocomplete="off">
                            <button class="edit-action-btn save-action-btn" onclick="saveCustomIcNickname()">ULOŽIT IC PŘEZDÍVKU</button>
                        </div>
                    `;
                }
                else if (openedTab === 'zamestnanci') {
                    if (!state.isAdmin && !state.isServerAdmin) {
                        if (!loggedInMemberId) {
                            contentHTML += `<div class="terminal-card">
                                <div class="terminal-title"> 🔐 PŘÍSTUP DO SLOŽEK ČLENŮ</div>
                                <div style="font-size: 13px; margin-bottom: 8px;">Zadej své IC jméno (pokud složka neexistuje, vytvoří se):</div>
                                <input type="text" id="newMemberNameInput" class="pager-edit-input" placeholder="Tvoje IC jméno..." style="margin-bottom: 10px;" autocomplete="off">
                                <button class="edit-action-btn save-action-btn" onclick="createOrLoginMember()">VSTOUPIT / VYTVOŘIT MOJI SLOŽKU</button>
                            </div>
                            <div style="font-size: 12px; color: #8e9297; margin-top: 10px;">Seznam složek:</div>`;
                        }
                    }

                    if (!state.isAdmin && !state.isServerAdmin && selectedEmployeeId !== null && Number(selectedEmployeeId) !== Number(loggedInMemberId)) {
                        contentHTML += `<div style="color: #ff6b81; font-weight: bold; padding: 20px; text-align: center;">
                            [ ✕ ] PŘÍSTUP ODEPŘEN<br><br>
                            <span style="font-size: 12px; color: #8e9297;">Nemáš oprávnění nahlížet do složek ostatních členů!</span>
                        </div>
                        <button class="edit-action-btn save-action-btn" onclick="selectedEmployeeId=Number(loggedInMemberId); render();" style="margin-top: 15px;">ZPĚT DO MOJÍ SLOŽKY</button>`;
                        body.innerHTML = contentHTML;
                        return;
                    }

                    if (selectedEmployeeId !== null) {
                        let emp = state.zamestnanci.find(e => e.id === Number(selectedEmployeeId));
                        if (emp) {
                            title.innerText = `> SLOŽKA: ${emp.name.toUpperCase()}`;
                            
                            contentHTML += `<div class="terminal-card">
                                <div class="terminal-title">📋 OSOBNÍ ÚDAJE</div>
                                <div style="font-size: 13px; margin-bottom: 6px;"><b>Telefon:</b> ${state.isServerAdmin ? emp.phone : `<input type="text" id="edit_emp_phone" class="pager-edit-input" value="${emp.phone || ''}" placeholder="Tvé telefonní číslo" style="display:inline-block; width:220px; margin-left:10px;">`}</div>
                                <div style="font-size: 13px; margin-bottom: 8px;"><b>Bankovní účet:</b> ${state.isServerAdmin ? emp.bank : `<input type="text" id="edit_emp_bank" class="pager-edit-input" value="${emp.bank || ''}" placeholder="Tvé číslo účtu" style="display:inline-block; width:220px; margin-left:10px;">`}</div>
                                ${!state.isServerAdmin ? `<button class="edit-action-btn save-action-btn" onclick="saveEmployeeDetails()">Uložit kontaktní údaje</button>` : ''}
                            </div>`;

                            contentHTML += `<div style="font-size: 13px; font-weight: bold; color: #f39c12; margin: 4px 0 6px 0;">ZÁZNAMY A DŮKAZY:</div>`;
                            
                            if (!state.isServerAdmin && (state.isAdmin || Number(emp.id) === Number(loggedInMemberId))) {
                                contentHTML += `<div class="simple-form-box">
                                    <input type="text" id="zaznam_title" class="pager-edit-input" placeholder="Popis věci / oznámení">
                                    <input type="text" id="zaznam_proof" class="pager-edit-input" placeholder="URL odkaz na fotku / důkaz">
                                    <button class="edit-action-btn save-action-btn" onclick="addZaznamToEmployee(${emp.id})">+ Přidat položku</button>
                                </div>`;
                            }

                            if (!emp.zaznamy || emp.zaznamy.length === 0) {
                                contentHTML += `<div style="color: #666; font-size: 13px; padding: 6px;">Zatím žádné záznamy.</div>`;
                            } else {
                                emp.zaznamy.forEach(z => {
                                    contentHTML += `<div class="terminal-card">
                                        <div class="terminal-title">📌 ${z.title}
                                            ${(state.isAdmin || Number(emp.id) === Number(loggedInMemberId)) ? `<button class="edit-action-btn delete-action-btn" onclick="deleteZaznam(${emp.id},${z.id})">Smazat</button>` : ''}
                                        </div>
                                        ${z.proofUrl ? `<div style="margin-top:6px;"><button class="edit-action-btn save-action-btn" onclick="showImageModal('${z.proofUrl}')">🔍 Zobrazit důkaz v okénku</button></div>` : ''}
                                    </div>`;
                                });
                            }

                            if (!state.isAdmin && !state.isServerAdmin) {
                                contentHTML += `<button class="edit-action-btn delete-action-btn" onclick="loggedInMemberId=null; selectedEmployeeId=null; render();" style="margin-top: 15px;">Odhlásit se z mojí složky</button>`;
                            }
                        }
                    } else {
                        contentHTML += `<table><tr><th>JMÉNO SLOŽKY</th><th>AKCE</th></tr>`;
                        state.zamestnanci.forEach(e => {
                            let isMyFolder = (!state.isAdmin && !state.isServerAdmin && Number(e.id) === Number(loggedInMemberId));
                            
                            if (!state.isAdmin && !state.isServerAdmin && !isMyFolder) return;

                            contentHTML += `<tr>
                                <td><a href="#" onclick="selectedEmployeeId=${e.id}; render(); return false;" style="color:${isMyFolder ? '#4cd137' : '#f39c12'}; text-decoration:underline;">📁 ${e.name} ${isMyFolder ? '(Moje)' : ''}</a></td>
                                <td>
                                    <div class="action-buttons-group">
                                        <button class="edit-action-btn" onclick="selectedEmployeeId=${e.id}; render();">Otevřít</button>
                                        ${state.isAdmin && !state.isServerAdmin ? `<button class="edit-action-btn delete-action-btn" onclick="deleteEmployee(${e.id})">Smazat</button>` : ''}
                                    </div>
                                </td>
                            </tr>`;
                        });
                        contentHTML += `</table>`;
                    }
                }
                else if (openedTab === 'oznameni') {
                    let editItem = state.oznameni.find(i => i.id === editingItemId);
                    let currentAuthor = getCurrentAuthorName();

                    if (state.isAdmin && !state.isServerAdmin) {
                        contentHTML += `<div class="simple-form-box">
                            <input type="text" id="ann_title" class="pager-edit-input" placeholder="Nadpis oznámení" value="${editItem ? editItem.title : ''}">
                            <input type="text" id="ann_text" class="pager-edit-input" placeholder="Text oznámení" value="${editItem ? editItem.text : ''}">
                            <div style="display:flex; gap:6px;">
                                <button class="edit-action-btn save-action-btn" onclick="saveItem('oznameni')">${editingItemId ? '💾 Uložit' : '+ Přidat oznámení'}</button>
                                ${editingItemId ? `<button class="edit-action-btn delete-action-btn" onclick="cancelEditing()">Zrušit</button>` : ''}
                            </div>
                        </div>`;
                    } else {
                        contentHTML += `<div class="simple-form-box">
                            <input type="text" id="ann_title" class="pager-edit-input" placeholder="Nadpis mého oznámení" value="${editItem ? editItem.title : ''}">
                            <input type="text" id="ann_text" class="pager-edit-input" placeholder="Text mého oznámení" value="${editItem ? editItem.text : ''}">
                            <div style="display:flex; gap:6px;">
                                <button class="edit-action-btn save-action-btn" onclick="saveItem('oznameni')">${editingItemId ? '💾 Uložit' : '+ Přidat oznámení'}</button>
                                ${editingItemId ? `<button class="edit-action-btn delete-action-btn" onclick="cancelEditing()">Zrušit</button>` : ''}
                            </div>
                        </div>`;
                    }

                    state.oznameni.forEach(item => {
                        let canEditDel = (state.isAdmin || item.author === currentAuthor);
                        contentHTML += `<div class="terminal-card">
                            <div class="terminal-title"># ${item.title} <span style="font-size:10px; color:#666;">(Autor: ${item.author})</span>
                                <div class="action-buttons-group">
                                    ${canEditDel ? `<button class="edit-action-btn" onclick="startEditing('oznameni', ${item.id})">Upravit</button>` : ''}
                                    ${canEditDel ? `<button class="edit-action-btn delete-action-btn" onclick="deleteItem('oznameni', ${item.id})">Smazat</button>` : ''}
                                </div>
                            </div>
                            <div>${item.text}</div>
                        </div>`;
                    });
                }
                else if (openedTab === 'info') {
                    let editItem = state.info.find(i => i.id === editingItemId);
                    let currentAuthor = getCurrentAuthorName();

                    if (!state.isServerAdmin) {
                        contentHTML += `<div class="simple-form-box">
                            <input type="text" id="info_title" class="pager-edit-input" placeholder="Nadpis info" value="${editItem ? editItem.title : ''}">
                            <input type="text" id="info_text" class="pager-edit-input" placeholder="Obsah info" value="${editItem ? editItem.text : ''}">
                            <div style="display:flex; gap:6px;">
                                <button class="edit-action-btn save-action-btn" onclick="saveItem('info')">${editingItemId ? '💾 Uložit' : '+ Přidat info'}</button>
                                ${editingItemId ? `<button class="edit-action-btn delete-action-btn" onclick="cancelEditing()">Zrušit</button>` : ''}
                            </div>
                        </div>`;
                    }

                    state.info.forEach(item => {
                        let canEditDel = (!state.isServerAdmin && (state.isAdmin || item.author === currentAuthor));
                        contentHTML += `<div class="terminal-card">
                            <div class="terminal-title"># ${item.title} <span style="font-size:10px; color:#666;">(Autor: ${item.author})</span>
                                <div class="action-buttons-group">
                                    ${canEditDel ? `<button class="edit-action-btn" onclick="startEditing('info', ${item.id})">Upravit</button>` : ''}
                                    ${canEditDel ? `<button class="edit-action-btn delete-action-btn" onclick="deleteItem('info', ${item.id})">Smazat</button>` : ''}
                                </div>
                            </div>
                            <div>${item.text}</div>
                        </div>`;
                    });
                }
                else if (openedTab === 'freq') {
                    // UPRAVENO: Povoleno pro Vedení i běžného uživatele (přihlášeného s přístupem / membro)
                    let canChangeFreq = (state.hasAccess && !state.isServerAdmin);
                    contentHTML += `
                        <div class="terminal-card">
                            <div class="terminal-title">AKTUÁLNÍ FREKVENCE KLUBU</div>
                            <div style="font-size:20px; color:#f39c12; margin-bottom:10px;">${state.currentFreq}</div>
                            ${canChangeFreq ? `
                                <div style="display:flex; gap:8px;">
                                    <input type="text" id="freqInput" class="pager-edit-input" value="${state.currentFreq}">
                                    <button class="edit-action-btn save-action-btn" onclick="updateFrequency()">Změnit Freq</button>
                                </div>
                            ` : '<div style="font-size:12px; color:#8e9297;">(Pouze pro čtení)</div>'}
                        </div>`;
                }
                else if (openedTab === 'kaple') {
                    if (state.isServerAdmin) {
                        contentHTML += `<div style="color:#ff6b81; font-weight:bold; text-align:center; padding:30px;">[ ✕ ] ZABEZPEČENÁ KAPLE</div>`;
                    } else {
                        let editItem = state.kaple.find(i => i.id === editingItemId);
                        let currentAuthor = getCurrentAuthorName();
                        let canManageKaple = (state.isAdmin || state.isSecretario);

                        if (canManageKaple) {
                            contentHTML += `<div class="simple-form-box">
                                <input type="text" id="kaple_title" class="pager-edit-input" placeholder="Nadpis poznámky" value="${editItem ? editItem.title : ''}">
                                <input type="text" id="kaple_text" class="pager-edit-input" placeholder="Text" value="${editItem ? editItem.text : ''}">
                                <div style="display:flex; gap:6px;">
                                    <button class="edit-action-btn save-action-btn" onclick="saveItem('kaple')">${editingItemId ? '💾 Uložit' : '+ Přidat poznámku'}</button>
                                    ${editingItemId ? `<button class="edit-action-btn delete-action-btn" onclick="cancelEditing()">Zrušit</button>` : ''}
                                </div>
                            </div>`;
                        }

                        state.kaple.forEach(k => {
                            let canEditDel = (canManageKaple || k.author === currentAuthor);
                            contentHTML += `<div class="terminal-card">
                                <div class="terminal-title"># ${k.title} <span style="font-size:10px; color:#666;">(Autor: ${k.author})</span>
                                    <div class="action-buttons-group">
                                        ${canEditDel ? `<button class="edit-action-btn" onclick="startEditing('kaple', ${k.id})">Upravit</button>` : ''}
                                        ${canEditDel ? `<button class="edit-action-btn delete-action-btn" onclick="deleteItem('kaple', ${k.id})">Smazat</button>` : ''}
                                    </div>
                                </div>
                                <div>${k.text}</div>
                            </div>`;
                        });
                    }
                }
                else if (openedTab === 'parking') {
                    let editItem = state.parking.find(i => i.id === editingItemId);
                    if (state.isAdmin && !state.isServerAdmin) {
                        contentHTML += `<div class="simple-form-box">
                            <input type="text" id="park_rank" class="pager-edit-input" placeholder="Rank" value="${editItem ? editItem.rank : ''}">
                            <input type="text" id="park_spot" class="pager-edit-input" placeholder="Místo / garáž" value="${editItem ? editItem.spot : ''}">
                            <div style="display:flex; gap:6px;">
                                <button class="edit-action-btn save-action-btn" onclick="saveItem('parking')">${editingItemId ? '💾 Uložit' : '+ Přidat parkování'}</button>
                                ${editingItemId ? `<button class="edit-action-btn delete-action-btn" onclick="cancelEditing()">Zrušit</button>` : ''}
                            </div>
                        </div>`;
                    }
                    contentHTML += `<table><tr><th>RANK</th><th>MÍSTO</th> ${state.isAdmin && !state.isServerAdmin ? '<th>AKCE</th>' : ''}</tr>`;
                    state.parking.forEach((p) => {
                        contentHTML += `<tr><td>${p.rank}</td><td>${p.spot}</td>`;
                        if (state.isAdmin && !state.isServerAdmin) {
                            contentHTML += `<td>
                                <div class="action-buttons-group">
                                    <button class="edit-action-btn" onclick="startEditing('parking', ${p.id})">Upravit</button>
                                    <button class="edit-action-btn delete-action-btn" onclick="deleteItem('parking', ${p.id})">Smazat</button>
                                </div>
                            </td>`;
                        }
                        contentHTML += `</tr>`;
                    });
                    contentHTML += `</table>`;
                }
                else if (openedTab === 'pujcky') {
                    if (!state.isAdmin) {
                        contentHTML += `<div style="color:#ff6b81; font-weight:bold; text-align:center; padding:30px;">[ ✕ ] PŘÍSTUP ODEPŘEN: Půjčky jsou dostupné pouze pro Vedení.</div>`;
                    } else {
                        let editItem = state.pujcky.find(i => i.id === editingItemId);
                        contentHTML += `<div class="simple-form-box">
                            <input type="text" id="loan_debtor" class="pager-edit-input" placeholder="Dlužník" value="${editItem ? editItem.debtor : ''}">
                            <input type="text" id="loan_amount" class="pager-edit-input" placeholder="Částka" value="${editItem ? editItem.amount : ''}">
                            <input type="text" id="loan_note" class="pager-edit-input" placeholder="Poznámka" value="${editItem ? editItem.note : ''}">
                            <div style="display:flex; gap:6px;">
                                <button class="edit-action-btn save-action-btn" onclick="saveItem('pujcky')">${editingItemId ? '💾 Uložit' : '+ Přidat půjčku'}</button>
                                ${editingItemId ? `<button class="edit-action-btn delete-action-btn" onclick="cancelEditing()">Zrušit</button>` : ''}
                            </div>
                        </div>`;
                        contentHTML += `<table><tr><th>DLUŽNÍK</th><th>ČÁSTKA</th><th>POZNÁMKA</th><th>AKCE</th></tr>`;
                        state.pujcky.forEach((p) => {
                            contentHTML += `<tr><td>${p.debtor}</td><td><b>${p.amount}</b></td><td>${p.note || ''}</td><td>
                                <div class="action-buttons-group">
                                    <button class="edit-action-btn" onclick="startEditing('pujcky', ${p.id})">Upravit</button>
                                    <button class="edit-action-btn delete-action-btn" onclick="deleteItem('pujcky', ${p.id})">Smazat</button>
                                </div>
                            </td></tr>`;
                        });
                        contentHTML += `</table>`;
                    }
                }
                else if (openedTab === 'pokuty') {
                    if (!state.isAdmin) {
                        contentHTML += `<div style="color:#ff6b81; font-weight:bold; text-align:center; padding:30px;">[ ✕ ] PŘÍSTUP ODEPŘEN: Pokuty jsou dostupné pouze pro Vedení.</div>`;
                    } else {
                        let editItem = state.pokuty.find(i => i.id === editingItemId);
                        contentHTML += `<div class="simple-form-box">
                            <input type="text" id="fine_member" class="pager-edit-input" placeholder="Člen" value="${editItem ? editItem.member : ''}">
                            <input type="text" id="fine_amount" class="pager-edit-input" placeholder="Výše pokuty" value="${editItem ? editItem.amount : ''}">
                            <input type="text" id="fine_reason" class="pager-edit-input" placeholder="Důvod" value="${editItem ? editItem.reason : ''}">
                            <div style="display:flex; gap:6px;">
                                <button class="edit-action-btn save-action-btn" onclick="saveItem('pokuty')">${editingItemId ? '💾 Uložit' : '+ Přidat pokutu'}</button>
                                ${editingItemId ? `<button class="edit-action-btn delete-action-btn" onclick="cancelEditing()">Zrušit</button>` : ''}
                            </div>
                        </div>`;
                        contentHTML += `<table><tr><th>ČLEN</th><th>VÝŠE</th><th>DŮVOD</th><th>AKCE</th></tr>`;
                        state.pokuty.forEach((p) => {
                            contentHTML += `<tr><td>${p.member}</td><td><b style="color:#ff6b81;">${p.amount}</b></td><td>${p.reason || ''}</td><td>
                                <div class="action-buttons-group">
                                    <button class="edit-action-btn" onclick="startEditing('pokuty', ${p.id})">Upravit</button>
                                    <button class="edit-action-btn delete-action-btn" onclick="deleteItem('pokuty', ${p.id})">Smazat</button>
                                </div>
                            </td></tr>`;
                        });
                        contentHTML += `</table>`;
                    }
                }
                else if (openedTab === 'kontakty') {
                    let editItem = state.kontakty.find(i => i.id === editingItemId);
                    let currentAuthor = getCurrentAuthorName();

                    if (!state.isServerAdmin) {
                        contentHTML += `<div class="simple-form-box">
                            <input type="text" id="contact_name" class="pager-edit-input" placeholder="Jméno / Instituce" value="${editItem ? editItem.name : ''}">
                            <input type="text" id="contact_phone" class="pager-edit-input" placeholder="Telefon" value="${editItem ? editItem.phone : ''}">
                            <input type="text" id="contact_note" class="pager-edit-input" placeholder="Poznámka" value="${editItem ? editItem.note : ''}">
                            <div style="display:flex; gap:6px;">
                                <button class="edit-action-btn save-action-btn" onclick="saveItem('kontakty')">${editingItemId ? '💾 Uložit' : '+ Přidat kontakt'}</button>
                                ${editingItemId ? `<button class="edit-action-btn delete-action-btn" onclick="cancelEditing()">Zrušit</button>` : ''}
                            </div>
                        </div>`;
                    }
                    contentHTML += `<table><tr><th>JMÉNO</th><th>TELEFON</th><th>POZNÁMKA</th> ${!state.isServerAdmin ? '<th>AKCE</th>' : ''}</tr>`;
                    state.kontakty.forEach(k => {
                        let canEditDel = (!state.isServerAdmin && (state.isAdmin || k.author === currentAuthor));
                        contentHTML += `<tr><td>${k.name}</td><td>${k.phone}</td><td>${k.note || ''}</td>`;
                        if (!state.isServerAdmin) {
                            contentHTML += `<td>
                                <div class="action-buttons-group">
                                    ${canEditDel ? `<button class="edit-action-btn" onclick="startEditing('kontakty', ${k.id})">Upravit</button>` : ''}
                                    ${canEditDel ? `<button class="edit-action-btn delete-action-btn" onclick="deleteItem('kontakty', ${k.id})">Smazat</button>` : ''}
                                </div>
                            </td>`;
                        }
                        contentHTML += `</tr>`;
                    });
                    contentHTML += `</table>`;
                }

                body.innerHTML = contentHTML;
                setTimeout(() => {
                    const firstInput = body.querySelector('input');
                    if (firstInput && openedTab !== 'livechat' && !state.isServerAdmin) firstInput.focus();
                    if (openedTab === 'livechat' && !state.isServerAdmin) scrollToBottomChat();
                }, 50);
            }
        }

        setInterval(() => {
            document.getElementById('screenTime').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        loadCloudData();
    </script>
</body>
</html>
