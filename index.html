        async function processAndVerifyToken(accessToken) {
            try {
                const userRes = await fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${accessToken}` }
                });
                if (!userRes.ok) return false;
                const userData = await userRes.json();

                const memberRes = await fetch(`https://discord.com/api/users/@me/guilds/${DISCORD_GUILD_ID}/member`, {
                    headers: { authorization: `Bearer ${accessToken}` }
                });

                let hasAccess = false;
                let isAdmin = false;
                let isSecretario = false;
                let isServerAdmin = false;

                if (memberRes.ok) {
                    const memberData = await memberRes.json();
                    if (memberData && memberData.roles) {
                        const hasMiembro = memberData.roles.includes(MIEMBRO_ROLE);
                        const hasAdminRole = memberData.roles.some(roleId => ADMIN_ROLES.includes(roleId));
                        const hasSecretarioRole = memberData.roles.includes(SECRETARIO_ROLE);
                        const hasServerAdminRole = memberData.roles.includes(SERVER_ADMIN_ROLE);

                        if (hasServerAdminRole) {
                            hasAccess = true;
                            isServerAdmin = true;
                        } else if (hasMiembro || hasAdminRole || hasSecretarioRole) {
                            hasAccess = true;
                            if (hasAdminRole) {
                                isAdmin = true;
                            } else if (hasSecretarioRole) {
                                isSecretario = true;
                            }
                        }
                    }
                }

                state.discordUser = userData.username;
                state.isAuthenticated = true;
                state.hasAccess = hasAccess;
                state.isAdmin = isAdmin;
                state.isSecretario = isSecretario;
                state.isServerAdmin = isServerAdmin;

                const sessionData = {
                    isAuthenticated: true,
                    hasAccess: hasAccess,
                    isAdmin: isAdmin,
                    isSecretario: isSecretario,
                    isServerAdmin: isServerAdmin,
                    discordUser: userData.username,
                    token: accessToken
                };
                localStorage.setItem('pager_user_session', JSON.stringify(sessionData));
                return true;
            } catch (e) {
                return false;
            }
        }

        async function loadSessionFromStorage() {
            const saved = localStorage.getItem('pager_user_session');
            if (!saved) return false;
            
            try {
                const data = JSON.parse(saved);
                if (!data.token) return false;

                const success = await processAndVerifyToken(data.token);
                if (!success) {
                    localStorage.removeItem('pager_user_session');
                    return false;
                }
                return true;
            } catch(e) {
                localStorage.removeItem('pager_user_session');
                return false;
            }
        }

            state.hasAccess = false;

            if (!DISCORD_WEBHOOK_URL) return;
            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },

        function loginWithDiscord() {
            const redirectUri = encodeURIComponent(window.location.href.split('#')[0].split('?')[0]);
            const scope = encodeURIComponent("identify guilds.members.read");
            const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${redirectUri}&response_type=token&scope=${scope}`;

        async function checkDiscordAuth() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                window.history.pushState({}, document.title, window.location.pathname);
                await processAndVerifyToken(accessToken);
                updateUIState();
                render();
            }
        }

        async function fetchChatMessages(shouldRender = false) {
            if (!supabaseClient || state.isServerAdmin) return;
            try {
                let { data: chatData, error } = await supabaseClient.from('chat').select('*').order('created_at', { ascending: true });
                if (error) {
                    console.error("Chyba dotazu na chat:", error);
                    return;
                }
                if (chatData) {
                    const newMessages = chatData.map(m => ({
                        id: m.id, sender: m.sender, text: m.text,
                        time: new Date(m.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        isAdmin: m.is_admin
                    }));
                    
                    if (newMessages.length !== chatMessages.length || JSON.stringify(newMessages) !== JSON.stringify(chatMessages)) {
                        chatMessages = newMessages;
                        if (shouldRender && state.hasAccess && openedTab === 'livechat') {
                            const activeInput = document.getElementById('chatInputField');
                            const savedText = activeInput ? activeInput.value : "";

                            render();
                            scrollToBottomChat();

                            const restoredInput = document.getElementById('chatInputField');
                            if (restoredInput && savedText) {
                                restoredInput.value = savedText;
                                restoredInput.focus();
                                restoredInput.setSelectionRange(restoredInput.value.length, restoredInput.value.length);
                            }
                        }
                    }
                }
            } catch (err) { console.error("Chyba při načítání chatu:", err); }
        }

        async function loadCloudData() {
            await checkDiscordAuth();

            if (!state.isAuthenticated) {
                await loadSessionFromStorage();
            }

            if (!supabaseClient) { render(); return; }
            try {
                let { data: appData } = await supabaseClient.from('app_data').select('data').eq('key', 'main_state').single();
                if (appData && appData.data) {
                    const cloudState = appData.data;
                    state.slozky = cloudState.slozky || state.slozky;
                    state.prodej_meth = cloudState.prodej_meth || state.prodej_meth;
                    state.zamestnanci = cloudState.zamestnanci || state.zamestnanci;
                    state.oznameni = cloudState.oznameni || state.oznameni;
                    state.info = cloudState.info || state.info;
                    state.kaple = cloudState.kaple || state.kaple;
                    state.parking = cloudState.parking || state.parking;
                    state.pujcky = cloudState.pujcky || state.pujcky;
                    state.pokuty = cloudState.pokuty || state.pokuty;
                    state.kontakty = cloudState.kontakty || state.kontakty;
                    state.currentFreq = cloudState.currentFreq || state.currentFreq;
                }
                
                if (!state.isServerAdmin) {
                    await fetchChatMessages(false);
                    
                    supabaseClient.channel('public:chat')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat' }, payload => {
                            const m = payload.new;
                            if (!chatMessages.some(e => e.id === m.id)) {
                                chatMessages.push({
                                    id: m.id, sender: m.sender, text: m.text,
                                    time: new Date(m.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                                    isAdmin: m.is_admin
                                });
                                if (state.hasAccess && openedTab === 'livechat') {
                                    const activeInput = document.getElementById('chatInputField');
                                    const savedText = activeInput ? activeInput.value : "";

                                    render();
                                    scrollToBottomChat();

                                    const restoredInput = document.getElementById('chatInputField');
                                    if (restoredInput && savedText) {
                                        restoredInput.value = savedText;
                                        restoredInput.focus();
                                        restoredInput.setSelectionRange(restoredInput.value.length, restoredInput.value.length);
                                    }
                                }
                            }
                        })
                        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'chat' }, () => {
                            fetchChatMessages(true);
                        })
                        .subscribe();
                }

                supabaseClient.channel('public:app_data')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_data' }, payload => {
                        if (payload.new && payload.new.key === 'main_state' && payload.new.data) {
                            const cloudState = payload.new.data;
                            state.slozky = cloudState.slozky || state.slozky;
                            state.prodej_meth = cloudState.prodej_meth || state.prodej_meth;
                            state.zamestnanci = cloudState.zamestnanci || state.zamestnanci;
                            state.oznameni = cloudState.oznameni || state.oznameni;
                            state.info = cloudState.info || state.info;
                            state.kaple = cloudState.kaple || state.kaple;
                            state.parking = cloudState.parking || state.parking;
                            state.pujcky = cloudState.pujcky || state.pujcky;
                            state.pokuty = cloudState.pokuty || state.pokuty;
                            state.kontakty = cloudState.kontakty || state.kontakty;
                            state.currentFreq = cloudState.currentFreq || state.currentFreq;
                            render();
                        }
                    })
                    .subscribe();

                document.getElementById('cloudStatus').innerText = "SYNCHRONIZACE: LIVE (ONLINE)";
            } catch (err) {
                document.getElementById('cloudStatus').innerText = "SYNCHRONIZACE: LOKÁLNÍ REŽIM";
            }
            render();
        }

        function saveItem(category) {
            if (!state.hasAccess || state.isServerAdmin) return;
            const author = getCurrentAuthorName();
            
            if (category === 'slozky') {
                if (state.isServerAdmin) return;
                const title = document.getElementById('folder_title')?.value;
                const desc = document.getElementById('folder_desc')?.value;
                const photos = [
                    document.getElementById('folder_photo_1')?.value || '',
                    document.getElementById('folder_photo_2')?.value || '',
                    document.getElementById('folder_photo_3')?.value || '',
                    document.getElementById('folder_photo_4')?.value || '',
                    document.getElementById('folder_photo_5')?.value || ''
                ].filter(url => url.trim() !== '');

                if (!title || !desc) return;
                if (editingItemId) {
                    let item = state.slozky.find(i => i.id === editingItemId);
                    if (item && (state.isAdmin || item.author === author)) {
                        item.title = title;
                        item.desc = desc;
                        item.photos = photos;
                    }
                } else {
                    state.slozky.push({ id: Date.now(), author, title, desc, photos });
                }
            } else if (category === 'prodej_meth') {
                if (!state.isAdmin) return;
                const komu = document.getElementById('meth_komu')?.value;
                const zaKolik = document.getElementById('meth_za_kolik')?.value;
                const mnozstvi = document.getElementById('meth_mnozstvi')?.value;
                const kdy = document.getElementById('meth_kdy')?.value;

                if (editingItemId) {
                    let item = state.prodej_meth.find(i => i.id === editingItemId);
                    if (item) { item.komu = komu; item.zaKolik = zaKolik; item.mnozstvi = mnozstvi; item.kdy = kdy; }
                } else {
                    state.prodej_meth.push({ id: Date.now(), author, komu, zaKolik, mnozstvi, kdy });
                }
            } else if (category === 'oznameni') {
                if (!state.isAdmin) {

            if (category === 'info' && !state.isAdmin && item.author !== author) return;
            if (category === 'kontakty' && !state.isAdmin && item.author !== author) return;

            if (!state.hasAccess) return;

                render();

                render();

            if (openedTab !== null) {

            }

        function exportDatabaseJson() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `pager_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importDatabaseJson(event) {
            const fileReader = new FileReader();
            if (event.target.files && event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = async function (e) {
                    try {
                        const parsedData = JSON.parse(e.target.result);
                        if (parsedData && parsedData.zamestnanci) {
                            state = parsedData;
                            await saveCloudState();
                            alert("Záloha byla úspěšně importována a uložena!");
                            isFlipped = false;
                            playBeep(950, 0.06, 'sine', 0.04);
                            render();
                        } else {
                            alert("Neplatný formát souboru zálohy!");
                        }
                    } catch (err) {
                        alert("Chyba při čtení JSON souboru!");
                    }
                };
            }
        }

        document.addEventListener('keydown', (e) => {
            if (!state.hasAccess) return;
            const activeTag = document.activeElement?.tagName;
            const isTyping = (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT');

            if (activeModalImage !== null) { if (e.key === 'Escape' || e.key === 'Enter') closeImageModal(); return; }
            if (isFlipped) { if (e.key === 'Escape') toggleFlip(); return; }
            if (openedTab === 'livechat' && document.activeElement?.id === 'chatInputField' && !state.isServerAdmin) {
                if (e.key === 'Enter') { sendChatMessage(); e.preventDefault(); }
                return;
            }
            if (isTyping) return;

            if (e.key === 'ArrowUp' && openedTab === null) { navigateMenu(-1); e.preventDefault(); }
            else if (e.key === 'ArrowDown' && openedTab === null) { navigateMenu(1); e.preventDefault(); }
            else if (e.key === 'Enter' && openedTab === null) { openSelectedTab(); e.preventDefault(); }
            else if (e.key === 'Backspace' || e.key === 'Escape') { goBackToMenu(); e.preventDefault(); }
        });

        function kasaAddProduct(p) {
            const ex=pagerKasaCart.find(i=>i.name===p.name && i.price===p.price);
            if(ex) ex.qty++; else pagerKasaCart.push({...p,qty:1});
            render();

        function kasaChangeQty(i,d) {
            if(!pagerKasaCart[i]) return;
            pagerKasaCart[i].qty+=d;
            if(pagerKasaCart[i].qty<=0) pagerKasaCart.splice(i,1);
            render();

        function kasaSetPayment(m){ 
            pagerKasaPayment = m; 
            
            // Automatický zápis, výpis pager oznámení přímo do UI a následné vyčištění položek
            if ((m === 'HOTOVĚ' || m === 'FAKTURA') && pagerKasaCart.length > 0) {
                const input = document.getElementById('pagerKasaClient');
                const clientName = input ? input.value.trim() : '';
                if (clientName) {
                    const emp = state.zamestnanci.find(e => e.name.toLowerCase() === clientName.toLowerCase());
                    if (emp) {
                        const t = kasaTotals();
                        const itemsSummary = pagerKasaCart.map(i => `${i.qty}x ${i.name}`).join(', ');
                        const recordTitle = `Platba (${m}): ${t.total.toFixed(0)} $ | Provize: ${t.bartender.toFixed(0)} $ [${itemsSummary}]`;
                        
                        if (!emp.zaznamy) emp.zaznamy = [];

                        });

                        // Zde se vyprázdní košík a resetuje sleva po úspěšném účtování
                        pagerKasaCart = [];
                        pagerKasaDiscount = 0;
                        pagerKasaPayment = '-';
                        pagerKasaActiveBill = -1;
                    } else {
                        showPagerNotification(`Platba proběhla (${m}), ale zaměstnanec "${clientName}" nebyl nalezen ve složkách!`, true);

                    showPagerNotification(`Platba nastavená na ${m}, ale chybí vyplněné jméno zákazníka.`, true);

        }
        function kasaDiscount(){
            if(!pagerKasaCart.length) return;
            const v=prompt("Zadej výši slevy v % (např. 10 pro Vagos):",pagerKasaDiscount);
            if(v===null)return;
            const n=parseInt(v); if(isNaN(n)||n<0||n>100){showPagerNotification("Zadej číslo od 0 do 100.", true);return;}
            pagerKasaDiscount=n; render();
        }
        function kasaToggleCustomForm(){
            showCustomProductForm = !showCustomProductForm;

        function kasaSaveCustomProduct(){
            const nameInput = document.getElementById('customProdName');
            const priceInput = document.getElementById('customProdPrice');
            const costInput = document.getElementById('customProdCost');
            
            const name = nameInput ? nameInput.value.trim() : '';
            const price = priceInput ? parseFloat(priceInput.value) : NaN;
            const cost = costInput ? parseFloat(costInput.value) : 0;

            if(!name || isNaN(price) || price < 0){
                showPagerNotification("Zadej platný název a prodejní cenu položky!", true);
                return;
            }

            kasaAddProduct({ name, price, cost: isNaN(cost) ? 0 : cost, category: 'jidlo' });
            showCustomProductForm = false;
            showPagerNotification(`Vlastní položka "${name}" byla přidána do účtenky.`);
        }
        function kasaTotals(){
            const sub=pagerKasaCart.reduce((s,i)=>s+i.price*i.qty,0);
            const cost=pagerKasaCart.reduce((s,i)=>s+(i.cost||0)*i.qty,0);
            const discount=sub*(pagerKasaDiscount/100), total=sub-discount;
            return {sub,cost,discount,total,profit:total-cost,bartender:total*0.15};
        }
        function kasaClear(){pagerKasaCart=[];pagerKasaDiscount=0;pagerKasaPayment='-';pagerKasaActiveBill=-1;pagerKasaLastNotification=null;showCustomProductForm=false;render();}
        function kasaSaveBill(){
            const input=document.getElementById('pagerKasaClient'); const name=input?input.value.trim():'';
            if(!name||!pagerKasaCart.length){showPagerNotification("Zadej jméno a přidej produkty do účtenky!", true);return;}
            const t=kasaTotals();
            const bill={name,items:[...pagerKasaCart],total:t.total.toFixed(0),discount:pagerKasaDiscount,payment:pagerKasaPayment};
            if(pagerKasaActiveBill>-1) pagerKasaBills[pagerKasaActiveBill]=bill; else pagerKasaBills.push(bill);
            localStorage.setItem('chicanoCustomsOpenBills',JSON.stringify(pagerKasaBills));
            showPagerNotification("Účtenka byla uložena do otevřených účtů.");
            kasaClear();
        }

            const b=pagerKasaBills[i]; if(!b)return;
            pagerKasaCart=[...b.items]; pagerKasaDiscount=b.discount||0; pagerKasaPayment=b.payment||'-'; pagerKasaActiveBill=i; render();
        }
        function kasaDeleteBill(i){
            const billName = pagerKasaBills[i]?.name || 'neznámý';
            if(pagerKasaActiveBill===i) pagerKasaActiveBill=-1;
            pagerKasaBills.splice(i,1); 
            localStorage.setItem('chicanoCustomsOpenBills',JSON.stringify(pagerKasaBills)); 
            showPagerNotification(`Otevřený účet "${billName}" byl smazán.`);
        }

            h+='<div class="kasa-layout">';

            h+='<div class="kasa-grid"><button class="kasa-product kasa-custom" onclick="kasaToggleCustomForm()">Vlastní položka<span>Zadat...</span></button></div>';

                                <div class="action-buttons-group">
                                    <button class="edit-action-btn" onclick="startEditing('pokuty', ${p.id})">Upravit</button>
                                    <button class="edit-action-btn delete-action-btn" onclick="deleteItem('pokuty', ${p.id})">Smazat</button>
                                </div>
                            </td></tr>`;
                        });
                        contentHTML += `</table>`;
                    }
                }
                else if (openedTab === 'prodej_meth') {
                    if (!state.isAdmin) {
                        contentHTML += `<div style="color:#ff6b81; font-weight:bold; text-align:center; padding:30px;">[ ✕ ] PŘÍSTUP ODEPŘEN: Prodej METH je viditelný pouze pro Admin práva.</div>`;
                    } else {
                        let editItem = state.prodej_meth.find(i => i.id === editingItemId);
                        contentHTML += `<div class="simple-form-box">
                            <input type="text" id="meth_komu" class="pager-edit-input" placeholder="Komu (zákazník/postava)" value="${editItem ? editItem.komu : ''}">
                            <input type="text" id="meth_za_kolik" class="pager-edit-input" placeholder="Za kolik ($)" value="${editItem ? editItem.zaKolik : ''}">
                            <input type="text" id="meth_mnozstvi" class="pager-edit-input" placeholder="Množství" value="${editItem ? editItem.mnozstvi : ''}">
                            <input type="text" id="meth_kdy" class="pager-edit-input" placeholder="Kdy (datum/čas)" value="${editItem ? editItem.kdy : ''}">
                            <div style="display:flex; gap:6px;">
                                <button class="edit-action-btn save-action-btn" onclick="saveItem('prodej_meth')">${editingItemId ? '💾 Uložit' : '+ Přidat prodej'}</button>
                                ${editingItemId ? `<button class="edit-action-btn delete-action-btn" onclick="cancelEditing()">Zrušit</button>` : ''}
                            </div>
                        </div>`;
                        contentHTML += `<table><tr><th>KOMU</th><th>ZA KOLIK</th><th>MNOŽSTVÍ</th><th>KDY</th><th>AKCE</th></tr>`;
                        state.prodej_meth.forEach((p) => {
                            contentHTML += `<tr><td>${p.komu}</td><td><b style="color:#a3e635;">${p.zaKolik}</b></td><td>${p.mnozstvi}</td><td>${p.kdy}</td><td>
                                <div class="action-buttons-group">
                                    <button class="edit-action-btn" onclick="startEditing('prodej_meth', ${p.id})">Upravit</button>
                                    <button class="edit-action-btn delete-action-btn" onclick="deleteItem('prodej_meth', ${p.id})">Smazat</button>
                                </div>
                            </td></tr>`;
                        });
                        contentHTML += `</table>`;
                    }
                }
                else if (openedTab === 'kasa') {
                    contentHTML = kasaRender();
                }
                else if (openedTab === 'kontakty') {
                    let editItem = state.kontakty.find(i => i.id === editingItemId);
                    let currentAuthor = getCurrentAuthorName();

                    if (!state.isServerAdmin) {
                        contentHTML += `<div class="simple-form-box">
                            <input type="text" id="contact_name" class="pager-edit-input" placeholder="Jméno / Instituce" value="${editItem ? editItem.name : ''}">
                            <input type="text" id="contact_phone" class="pager-edit-input" placeholder="Telefon" value="${editItem ? editItem.phone : ''}">
                            <input type="text" id="contact_note" class="pager-edit-input" placeholder="Poznámka" value="${editItem ? editItem.note : ''}">
                            <div style="display:flex; gap:6px;">
                                <button class="edit-action-btn save-action-btn" onclick="saveItem('kontakty')">${editingItemId ? '💾 Uložit' : '+ Přidat kontakt'}</button>
                                ${editingItemId ? `<button class="edit-action-btn delete-action-btn" onclick="cancelEditing()">Zrušit</button>` : ''}
                            </div>
                        </div>`;
                    }
                    contentHTML += `<table><tr><th>JMÉNO</th><th>TELEFON</th><th>POZNÁMKA</th> ${!state.isServerAdmin ? '<th>AKCE</th>' : ''}</tr>`;
                    state.kontakty.forEach(k => {
                        let canEditDel = (!state.isServerAdmin && (state.isAdmin || k.author === currentAuthor));
                        contentHTML += `<tr><td>${k.name}</td><td>${k.phone}</td><td>${k.note || ''}</td>`;
                        if (!state.isServerAdmin) {
                            contentHTML += `<td>
                                <div class="action-buttons-group">
                                    ${canEditDel ? `<button class="edit-action-btn" onclick="startEditing('kontakty', ${k.id})">Upravit</button>` : ''}
                                    ${canEditDel ? `<button class="edit-action-btn delete-action-btn" onclick="deleteItem('kontakty', ${k.id})">Smazat</button>` : ''}
                                </div>
                            </td>`;
                         }
                        contentHTML += `</tr>`;
                    });
                    contentHTML += `</table>`;
                }

                body.innerHTML = contentHTML;
                setTimeout(() => {
                    const firstInput = body.querySelector('input');
                    if (firstInput && openedTab !== 'livechat' && !state.isServerAdmin) firstInput.focus();
                    if (openedTab === 'livechat' && !state.isServerAdmin) scrollToBottomChat();
                }, 50);
            }
        }

        setInterval(() => {
            document.getElementById('screenTime').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        loadCloudData();
    </script>
</body>
</html>
