                    isAuthenticated: true,
                    hasAccess: hasAccess,
                    isAdmin: isAdmin,
                    isSecretario: isSecretario,
                    isServerAdmin: isServerAdmin,
                    discordUser: userData.username,
                    token: accessToken
                };
                localStorage.setItem('pager_user_session', JSON.stringify(sessionData));
                return true;
            } catch (e) {
                return false;
            }
        }

        async function loadSessionFromStorage() {
            const saved = localStorage.getItem('pager_user_session');
            if (!saved) return false;
            
            try {
                const data = JSON.parse(saved);
                if (!data.token) return false;

                const success = await processAndVerifyToken(data.token);
                if (!success) {
                    localStorage.removeItem('pager_user_session');
                    return false;
                }
                return true;
            } catch(e) {
                localStorage.removeItem('pager_user_session');
                return false;
            }
        }

            localStorage.removeItem('pager_user_session');
            localStorage.removeItem('pager_custom_ic_nick');
            
            state.isAuthenticated = false;
            state.hasAccess = false;
            state.isAdmin = false;
            state.isSecretario = false;
            state.isServerAdmin = false;

        async function sendWebhookMessage(text) {
            if (!DISCORD_WEBHOOK_URL) return;
            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text })
                });

        function loginWithDiscord() {
            const redirectUri = encodeURIComponent(window.location.href.split('#')[0].split('?')[0]);
            const scope = encodeURIComponent("identify guilds.members.read");
            const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${redirectUri}&response_type=token&scope=${scope}`;
            window.location.href = authUrl;

        async function checkDiscordAuth() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                window.history.pushState({}, document.title, window.location.pathname);
                await processAndVerifyToken(accessToken);
                updateUIState();
                render();
            }

        async function fetchChatMessages(shouldRender = false) {
            if (!supabaseClient || state.isServerAdmin) return;
            try {
                let { data: chatData, error } = await supabaseClient.from('chat').select('*').order('created_at', { ascending: true });
                if (error) return;
                if (chatData) {
                    const newMessages = chatData.map(m => ({
                        id: m.id, sender: m.sender, text: m.text,
                        time: new Date(m.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        isAdmin: m.is_admin
                    }));
                    
                    if (newMessages.length !== chatMessages.length || JSON.stringify(newMessages) !== JSON.stringify(chatMessages)) {
                        chatMessages = newMessages;
                        if (shouldRender && state.hasAccess && openedTab === 'livechat') {
                            const activeInput = document.getElementById('chatInputField');
                            const savedText = activeInput ? activeInput.value : "";
                            render();
                            scrollToBottomChat();
                            const restoredInput = document.getElementById('chatInputField');
                            if (restoredInput && savedText) {
                                restoredInput.value = savedText;
                                restoredInput.focus();
                                restoredInput.setSelectionRange(restoredInput.value.length, restoredInput.value.length);
                            }
                        }
                    }
                }
            } catch (err) {}
        }

        async function loadCloudData() {
            await checkDiscordAuth();

            if (!state.isAuthenticated) {
                await loadSessionFromStorage();
            }

            if (!supabaseClient) { render(); return; }
            try {
                let { data: appData } = await supabaseClient.from('app_data').select('data').eq('key', 'main_state').single();
                if (appData && appData.data) {
                    const cloudState = appData.data;
                    state.gpsPoints = cloudState.gpsPoints || state.gpsPoints;
                    state.slozky = cloudState.slozky || state.slozky;
                    state.prodej_meth = cloudState.prodej_meth || state.prodej_meth;
                    state.zamestnanci = cloudState.zamestnanci || state.zamestnanci;
                    state.oznameni = cloudState.oznameni || state.oznameni;
                    state.info = cloudState.info || state.info;
                    state.kaple = cloudState.kaple || state.kaple;
                    state.parking = cloudState.parking || state.parking;
                    state.pujcky = cloudState.pujcky || state.pujcky;
                    state.pokuty = cloudState.pokuty || state.pokuty;
                    state.kontakty = cloudState.kontakty || state.kontakty;
                    state.currentFreq = cloudState.currentFreq || state.currentFreq;
                }
                
                if (!state.isServerAdmin) {
                    await fetchChatMessages(false);
                    
                    supabaseClient.channel('public:chat')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat' }, payload => {
                            const m = payload.new;
                            if (!chatMessages.some(e => e.id === m.id)) {
                                chatMessages.push({
                                    id: m.id, sender: m.sender, text: m.text,
                                    time: new Date(m.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                                    isAdmin: m.is_admin
                                });
                                if (state.hasAccess && openedTab === 'livechat') {
                                    render();
                                    scrollToBottomChat();
                                }
                            }
                        })
                        .subscribe();
                }

                supabaseClient.channel('public:app_data')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_data' }, payload => {
                        if (payload.new && payload.new.key === 'main_state' && payload.new.data) {
                            const cloudState = payload.new.data;
                            state.gpsPoints = cloudState.gpsPoints || state.gpsPoints;
                            state.slozky = cloudState.slozky || state.slozky;
                            state.prodej_meth = cloudState.prodej_meth || state.prodej_meth;
                            state.zamestnanci = cloudState.zamestnanci || state.zamestnanci;
                            state.oznameni = cloudState.oznameni || state.oznameni;
                            state.info = cloudState.info || state.info;
                            state.kaple = cloudState.kaple || state.kaple;
                            state.parking = cloudState.parking || state.parking;
                            state.pujcky = cloudState.pujcky || state.pujcky;
                            state.pokuty = cloudState.pokuty || state.pokuty;
                            state.kontakty = cloudState.kontakty || state.kontakty;
                            state.currentFreq = cloudState.currentFreq || state.currentFreq;
                            render();
                        }
                    })
                    .subscribe();

                document.getElementById('cloudStatus').innerText = "SYNCHRONIZACE: LIVE (ONLINE)";
            } catch (err) {
                document.getElementById('cloudStatus').innerText = "SYNCHRONIZACE: LOKÁLNÍ REŽIM";
            }
            render();
        }

        function handleMapMouseDown(e) {
            if (e.target.closest('.gps-map-pin')) return;
            isлегалDragging = true;
            hasMovedMap = false;
            dragStartX = e.clientX - gpsPanX;
            dragStartY = e.clientY - gpsPanY;
        }

        function handleMapMouseMove(e) {
            if (!isлегалDragging) return;
            const newX = e.clientX - dragStartX;
            const newY = e.clientY - dragStartY;
            if (Math.abs(newX - gpsPanX) > 2 || Math.abs(newY - gpsPanY) > 2) {
                hasMovedMap = true;
            }
            gpsPanX = newX;
            gpsPanY = newY;
            const canvasBg = document.getElementById('gtaCanvasBg');
            const pinsContainer = document.getElementById('gpsPinsContainer');
            if (canvasBg && pinsContainer) {
                const transformStr = `translate(${gpsPanX}px, ${gpsPanY}px) scale(${gpsZoom})`;
                canvasBg.style.transform = transformStr;
                pinsContainer.style.transform = transformStr;
            }
        }

        function handleMapMouseUp() {
            isлегалDragging = false;
        }

        function handleMapClick(e) {
            // Pokud uživatel s mapou posunoval (tahal myš), nepřidávat bod
            if (hasMovedMap) {
                hasMovedMap = false;
                return;
            }
            if (e.target.closest('.gps-map-pin') || e.target.closest('.gps-toolbar')) return;
            const viewport = document.getElementById('gpsMapViewport');
            if (!viewport) return;
            const rect = viewport.getBoundingClientRect();
            const clickX = (e.clientX - rect.left - gpsPanX) / gpsZoom;
            const clickY = (e.clientY - rect.top - gpsPanY) / gpsZoom;

            const title = prompt("Zadej název bodu na GPS:");
            if (!title) return;
            const desc = prompt("Zadej popis nebo poznámku:") || "";
            const cat = prompt("Zadej kategorii (prodej / lokace / utek):", "lokace") || "lokace";

            const newPoint = {
                id: Date.now(),
                author: getCurrentAuthorName(),
                category: cat.toLowerCase().trim(),
                title: title,
                desc: desc,
                x: clickX,
                y: clickY
            };

            state.gpsPoints.push(newPoint);
            saveCloudState();
            playBeep(950, 0.04, 'sine', 0.04);
            render();
        }

                    document.getElementById('folder_photo_1')?.value || '',
                    document.getElementById('folder_photo_2')?.value || '',
                    document.getElementById('folder_photo_3')?.value || ''
                ].filter(url => url.trim() !== '');

                if (editingItemId) {
                    let item = state.slozky.find(i => i.id === editingItemId);
                    if (item && (state.isAdmin || item.author === author)) { item.title = title; item.desc = desc; item.photos = photos; }
                } else {
                    state.slozky.push({ id: Date.now(), author, title, desc, photos });

            saveCloudState();
            render();
            if (openedTab === 'livechat' && !state.isServerAdmin) fetchChatMessages(true);
        }

        function goBackToMenu() {
            if (!state.hasAccess) return;
            if (activeModalImage !== null) { closeImageModal(); return; }
            if (isFlipped) { toggleFlip(); return; }
            
            if (openedTab === 'zamestnanci' && selectedEmployeeId !== null) {
                selectedEmployeeId = null;
                playBeep(550, 0.04, 'sine', 0.03);
                render();
                return;
            }
            if (editingItemId !== null) { editingItemId = null; render(); return; }
            if (openedTab !== null) playBeep(500, 0.04, 'sine', 0.03);
            openedTab = null;
            render();
        }

        function toggleFlip() {
            if (!state.isAdmin) return;
            isFlipped = !isFlipped;
            playBeep(750, 0.04, 'triangle', 0.035);
            render();
        }

        function exportDatabaseJson() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `pager_v3_backup.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function showImageModal(url) { activeModalImage = url; render(); }
        function closeImageModal() { activeModalImage = null; render(); }

        document.addEventListener('keydown', (e) => {
            if (!state.hasAccess) return;
            const activeTag = document.activeElement?.tagName;
            const isTyping = (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT');

            if (activeModalImage !== null) { if (e.key === 'Escape' || e.key === 'Enter') closeImageModal(); return; }
            if (isFlipped) { if (e.key === 'Escape') toggleFlip(); return; }
            if (isTyping) return;

            if (e.key === 'ArrowUp' && openedTab === null) { navigateMenu(-1); e.preventDefault(); }
            else if (e.key === 'ArrowDown' && openedTab === null) { navigateMenu(1); e.preventDefault(); }
            else if (e.key === 'Enter' && openedTab === null) { openSelectedTab(); e.preventDefault(); }
            else if (e.key === 'Backspace' || e.key === 'Escape') { goBackToMenu(); e.preventDefault(); }
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        function render() {
            const body = document.getElementById('screenBody');
            const title = document.getElementById('screenTitle');
            const screenContainer = document.querySelector('.pager-screen-container');
            body.innerHTML = "";
            updateUIState();

            const existingModal = document.getElementById('imageModalOverlay');
            if (existingModal) existingModal.remove();

            if (state.isAuthenticated && !state.hasAccess) {
                title.innerText = "> CHYBA PŘÍSTUPU";
                body.innerHTML = `<div class="access-denied-screen"><div class="access-denied-skull">💀</div><div>[ PŘÍSTUP ODEPŘEN ]</div></div>`;
                return;
            }

            if (!state.isAuthenticated) {
                title.innerText = "> PAGER SYSTEM v3";
                body.innerHTML = `<div class="locked-screen"><div style="font-size: 32px; font-weight: bold;">PAGER v3</div><div style="font-size: 12px;">ZAPNUTO / ČEKÁ NA PŘIPOJENÍ</div></div>`;
                return;
            }

            if (activeModalImage !== null) {
                const modalDiv = document.createElement('div');
                modalDiv.id = 'imageModalOverlay';
                modalDiv.className = 'image-modal-overlay';
                modalDiv.innerHTML = `<div class="image-modal-box"><img src="${activeModalImage}"><button class="edit-action-btn save-action-btn" onclick="closeImageModal()">ZAVŘÍT</button></div>`;
                screenContainer.appendChild(modalDiv);
                return;
            }

            if (isFlipped) {
                title.innerText = "> ADMIN SERVIS / ZÁLOHA";
                body.innerHTML = `<div class="terminal-card"><div class="terminal-title">💾 EXPORT</div><button class="edit-action-btn save-action-btn" onclick="exportDatabaseJson()">STÁHNOUT ZÁLOHU</button></div>`;
                return;
            }

            // Vykreslení samostatné GPS mapy jako záložky
            if (openedTab === 'gps') {
                title.innerText = "> GPS MAPA (LOS SANTOS)";
                let gpsHTML = `
                    <div class="gps-container">
                        <div class="gps-toolbar">
                            <div>Kategorie: 
                                <button class="edit-action-btn ${gpsActiveCategory==='vse'?'save-action-btn':''}" onclick="setGpsCategory('vse')">Vše</button>
                                <button class="edit-action-btn ${gpsActiveCategory==='prodej'?'save-action-btn':''}" onclick="setGpsCategory('prodej')">Prodej</button>
                                <button class="edit-action-btn ${gpsActiveCategory==='lokace'?'save-action-btn':''}" onclick="setGpsCategory('lokace')">Lokace</button>
                                <button class="edit-action-btn ${gpsActiveCategory==='utek'?'save-action-btn':''}" onclick="setGpsCategory('utek')">Spoty na útek</button>
                            </div>
                            <div>
                                <button class="edit-action-btn" onclick="gpsZoomOut()"> - Zoom </button>
                                <span style="margin:0 4px; color:#f39c12;">${Math.round(gpsZoom*100)}%</span>
                                <button class="edit-action-btn" onclick="gpsZoomIn()"> + Zoom </button>
                            </div>
                        </div>
                        <div class="gps-map-viewport" id="gpsMapViewport" 
                             onmousedown="handleMapMouseDown(event)" 
                             onmousemove="handleMapMouseMove(event)" 
                             onmouseup="handleMapMouseUp()" 
                             onclick="handleMapClick(event)">
                            <div class="gta-map-canvas-bg" id="gtaCanvasBg" style="transform: translate(${gpsPanX}px, ${gpsPanY}px) scale(${gpsZoom});"></div>
                            <div id="gpsPinsContainer" style="position:absolute; top:0; left:0; width:100%; height:100%; transform: translate(${gpsPanX}px, ${gpsPanY}px) scale(${gpsZoom}); pointer-events:none;">
                `;

                state.gpsPoints.forEach(pt => {
                    if (gpsActiveCategory !== 'vse' && pt.category !== gpsActiveCategory) return;
                    let icon = "📍";
                    if (pt.category === 'prodej') icon = "💰";
                    if (pt.category === 'lokace') icon = "🏠";
                    if (pt.category === 'utek') icon = "⚡";

                    let canDel = (state.isAdmin || pt.author === getCurrentAuthorName());

                    gpsHTML += `
                        <div class="gps-map-pin" style="left: ${pt.x}px; top: ${pt.y}px; pointer-events:auto;" title="${pt.title}: ${pt.desc} (Autor: ${pt.author})">
                            <div class="pin-marker-icon">${icon}</div>
                            <div class="pin-label">${pt.title} ${canDel ? `<span style="color:#ff6b81; cursor:pointer;" onclick="deleteGpsPoint(${pt.id}, event)">[x]</span>` : ''}</div>
                        </div>
                    `;
                });

                gpsHTML += `</div></div></div>`;
                body.innerHTML = gpsHTML;
                return;
            }

            if (openedTab === null) {
                title.innerText = "> HLAVNÍ MENU PAGERU v3";
                let menuHTML = `<div style="font-size: 12px; color: #4a7542; margin-bottom: 8px;">VYBER POLOŽKU A STISKNI [OK]:</div>`;
                tabsList.forEach((t, idx) => {
                    if (t.id === 'slozky' && state.isServerAdmin) return;
                    if (!state.isAdmin && (t.id === 'pujcky' || t.id === 'pokuty' || t.id === 'prodej_meth')) return;

                    let isFocused = (idx === currentIndex);
                    let marker = isFocused ? "▶ [ZVOLENO]" : "   ";
                    let redDotHTML = "";
                    if (t.id === 'oznameni' && state.hasUnreadAnnouncements) redDotHTML = `<span class="red-dot"></span>`;
                    if (t.id === 'freq' && state.hasUnreadFreq) redDotHTML = `<span class="red-dot"></span>`;

                    menuHTML += `<div class="menu-item-row ${isFocused ? 'focused' : ''}" onclick="currentIndex=${idx}; openSelectedTab();">
                        <span>${marker} ${t.name} ${redDotHTML}</span>
                    </div>`;
                });
                body.innerHTML = menuHTML;
            } 
            else {
                let currentTabObj = tabsList.find(t => t.id === openedTab);
                title.innerText = `> ${currentTabObj.name.toUpperCase()}`;
                let contentHTML = "";

                if (openedTab === 'freq') {
                    contentHTML += `
                        <div class="terminal-card">
                            <div class="terminal-title">AKTUÁLNÍ FREKVENCE KLUBU</div>
                            <div style="font-size:20px; color:#f39c12; margin-bottom:10px;">${state.currentFreq}</div>
                            <div style="display:flex; gap:8px; margin-bottom:15px;">
                                <input type="text" id="freqInput" class="pager-edit-input" value="${state.currentFreq}">
                                <button class="edit-action-btn save-action-btn" onclick="updateFrequency()">Změnit Freq</button>
                            </div>
                        </div>
                    `;
                }
                else if (openedTab === 'livechat') {
                    contentHTML += `<div id="chatMessagesContainer" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:8px;">`;
                    chatMessages.forEach(msg => {
                        contentHTML += `<div class="chat-message ${msg.isAdmin ? 'admin-msg' : ''}"><div class="chat-sender"><span>${msg.sender}</span><span class="chat-time">${msg.time}</span></div><div>${msg.text}</div></div>`;
                    });
                    contentHTML += `</div><div class="chat-input-box"><input type="text" id="chatInputField" class="chat-input" placeholder="Napiš zprávu..."><button class="hw-btn ok-btn" onclick="sendChatMessage()" style="height:38px;">ODESLAT</button></div>`;
                }
                else if (openedTab === 'nastaveni_nicku') {
                    const currentNick = localStorage.getItem('pager_custom_ic_nick') || getCurrentAuthorName();
                    contentHTML += `<div class="terminal-card"><div class="terminal-title">✏️ PŘEZDÍVKA</div><input type="text" id="customNickInput" class="pager-edit-input" value="${currentNick}" style="margin-bottom:10px;"><button class="edit-action-btn save-action-btn" onclick="saveCustomIcNickname()">ULOŽIT</button></div>`;
                }
                else if (openedTab === 'slozky') {
                    contentHTML += `<div style="color:#8e9297;">Sekce složek je připravena.</div>`;
                }
                else {
                    contentHTML += `<div style="color:#8e9297;">Obsah sekce se načítá...</div>`;
                }

                body.innerHTML = contentHTML;
            }
        }

        setInterval(() => {
            document.getElementById('screenTime').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        loadCloudData();
    </script>
</body>
</html>
