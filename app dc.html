<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicano Notes - Cloud Sync</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #313338; color: #dbdee1; 
            display: flex; height: 100vh; overflow: hidden; 
        }

        /* Levý panel - Seznam složek */
        .sidebar { 
            width: 260px; background-color: #2b2d31; 
            display: flex; flex-direction: column; 
            border-right: 1px solid #1f2023; 
        }
        .sidebar-header { 
            padding: 20px; font-weight: bold; font-size: 16px; color: #fff; 
            border-bottom: 2px solid #1f2023; text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .channel-list { 
            flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 4px; 
        }
        .channel-item { 
            padding: 10px 12px; border-radius: 4px; cursor: pointer; 
            color: #949ba4; font-size: 14px; display: flex; justify-content: space-between; align-items: center;
            transition: 0.15s; word-break: break-all;
        }
        .channel-item:hover { background-color: #35373c; color: #dbdee1; }
        .channel-item.active { background-color: #404249; color: #fff; font-weight: 500; }
        .channel-item .delete-btn { opacity: 0; color: #f23f43; background: none; border: none; cursor: pointer; font-size: 14px; }
        .channel-item:hover .delete-btn { opacity: 1; }

        .add-channel-box { padding: 10px; background-color: #232428; display: flex; gap: 6px; }
        .add-channel-box input { 
            flex: 1; background-color: #1e1f22; border: none; padding: 8px; border-radius: 4px; color: #fff; outline: none; font-size: 13px;
        }
        .add-channel-box button { 
            background-color: #248046; color: #fff; border: none; padding: 0 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .add-channel-box button:hover { background-color: #1a6334; }

        /* Pravý panel */
        .main-content { 
            flex: 1; display: flex; flex-direction: column; background-color: #313338; 
        }
        .chat-header { 
            height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
            font-size: 16px; font-weight: bold; color: #fff; border-bottom: 1px solid #1f2023; 
            background-color: #313338; gap: 10px;
        }
        
        /* Nastavení cloudu v hlavičce */
        .cloud-settings { display: flex; gap: 6px; align-items: center; font-size: 12px; }
        .cloud-settings input { background: #1e1f22; border: 1px solid #404249; color: #fff; padding: 4px 8px; border-radius: 4px; width: 110px; }
        .cloud-settings button { background: #5865f2; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .cloud-settings button:hover { background: #4752c4; }

        /* Záložky uvnitř složky */
        .tabs-bar {
            display: flex; align-items: center; background-color: #2b2d31; padding: 0 20px;
            border-bottom: 1px solid #1f2023; gap: 6px; overflow-x: auto; height: 45px;
        }
        .tab-item {
            padding: 6px 12px; border-radius: 4px 4px 0 0; background-color: #1e1f22; color: #949ba4;
            cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .tab-item:hover { color: #dbdee1; background-color: #26282c; }
        .tab-item.active { background-color: #313338; color: #fff; font-weight: 500; border-top: 2px solid #5865f2; }
        .tab-item .tab-delete { color: #f23f43; background: none; border: none; cursor: pointer; font-size: 12px; }
        
        .add-tab-box { display: flex; gap: 4px; align-items: center; margin-left: 10px; }
        .add-tab-box input { background: #1e1f22; border: none; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none; width: 100px; }
        .add-tab-box button { background: #248046; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }

        .editor-container { 
            flex: 1; padding: 20px; display: flex; flex-direction: column; 
        }
        textarea { 
            flex: 1; background-color: #383a40; border: none; border-radius: 8px; 
            color: #dbdee1; padding: 15px; font-size: 15px; font-family: inherit; 
            resize: none; outline: none; line-height: 1.5;
        }
        textarea:focus { border: 1px solid #5865f2; }
        
        .share-info {
            padding: 8px 20px; background-color: #2b2d31; font-size: 11px; color: #949ba4; display: flex; justify-content: space-between; align-items: center;
        }
        #syncStatus { color: #f0b232; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">Chicano Notes</div>
        <div class="channel-list" id="channelList"></div>
        <div class="add-channel-box">
            <input type="text" id="newChannelName" placeholder="Nová složka..." onkeypress="if(event.key === 'Enter') addChannel()">
            <button onclick="addChannel()">＋</button>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-header">
            <span id="currentChannelTitle"># vyber-složku</span>
            <!-- Nastavení cloudu přímo v hlavičce -->
            <div class="cloud-settings">
                <input type="text" id="binIdInput" placeholder="JSONBin ID">
                <input type="password" id="apiKeyInput" placeholder="API Key">
                <button onclick="saveCloudConfig()">Uložit klíče</button>
                <button onclick="fetchFromCloud()" style="background: #248046;">Stáhnout z cloudu</button>
            </div>
        </div>
        
        <div class="tabs-bar" id="tabsBar">
            <div id="tabsList" style="display: flex; gap: 6px;"></div>
            <div class="add-tab-box">
                <input type="text" id="newTabName" placeholder="Nová záložka..." onkeypress="if(event.key === 'Enter') addTab()">
                <button onclick="addTab()">＋</button>
            </div>
        </div>

        <div class="editor-container">
            <textarea id="noteContent" placeholder="Sem piš své poznámky..." oninput="updateContent()"></textarea>
        </div>
        <div class="share-info">
            <span id="syncStatus">Cloud: Nenastaveno (vyplň nahoře údaje)</span>
        </div>
    </div>

    <script>
        let appData = {
            "obecne": {
                "vitr": "Vítejte! Nastavte nahoře své JSONBin ID a API Key pro synchronizaci."
            }
        };
        let activeChannel = "obecne";
        let activeTab = "vitr";

        let binId = localStorage.getItem("chicano_bin_id") || "";
        let apiKey = localStorage.getItem("chicano_api_key") || "";

        window.onload = function() {
            document.getElementById('binIdInput').value = binId;
            document.getElementById('apiKeyInput').value = apiKey;

            if (binId && apiKey) {
                fetchFromCloud();
            } else {
                renderApp();
            }
        };

        function saveCloudConfig() {
            binId = document.getElementById('binIdInput').value.trim();
            apiKey = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem("chicano_bin_id", binId);
            localStorage.setItem("chicano_api_key", apiKey);
            alert("Klíče uloženy! Nyní zkus kliknout na 'Stáhnout z cloudu'.");
            fetchFromCloud();
        }

        // Stažení dat z JSONBin
        async function fetchFromCloud() {
            if (!binId || !apiKey) {
                alert("Nejprve vyplň Bin ID a API Key!");
                return;
            }
            document.getElementById('syncStatus').innerText = "Stahuji z cloudu...";
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    headers: { 'X-Master-Key': apiKey }
                });
                if (!response.ok) throw new Error("Chyba při stahování dat");
                const resData = await response.json();
                appData = resData.record;
                
                const channels = Object.keys(appData);
                if (channels.length > 0 && !appData[activeChannel]) {
                    activeChannel = channels[0];
                }
                checkActiveTab();
                renderApp();
                document.getElementById('syncStatus').innerText = "Cloud: Synchronizováno ✓";
            } catch (e) {
                console.error(e);
                document.getElementById('syncStatus').innerText = "Cloud: Chyba připojení ❌";
            }
        }

        // Odeslání dat do JSONBin
        let saveTimeout;
        function saveToCloud() {
            if (!binId || !apiKey) return;
            document.getElementById('syncStatus').innerText = "Ukládám do cloudu...";
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': apiKey
                        },
                        body: JSON.stringify(appData)
                    });
                    if (!response.ok) throw new Error("Chyba při uložení");
                    document.getElementById('syncStatus').innerText = "Cloud: Uloženo ✓";
                } catch (e) {
                    console.error(e);
                    document.getElementById('syncStatus').innerText = "Cloud: Chyba při ukládání ❌";
                }
            }, 1000); // Počká 1 sekundu po posledním psaní, aby to nesemlelo server
        }

        function checkActiveTab() {
            if (!appData[activeChannel]) return;
            const tabs = Object.keys(appData[activeChannel]);
            if (tabs.length > 0 && !appData[activeChannel][activeTab]) {
                activeTab = tabs[0];
            } else if (tabs.length === 0) {
                activeTab = "";
            }
        }

        function renderApp() {
            const listEl = document.getElementById('channelList');
            listEl.innerHTML = '';

            for (let channel in appData) {
                const item = document.createElement('div');
                item.className = `channel-item ${channel === activeChannel ? 'active' : ''}`;
                item.innerHTML = `
                    <span># ${channel}</span>
                    ${Object.keys(appData).length > 1 ? `<button class="delete-btn" onclick="deleteChannel(event, '${channel}')">✕</button>` : ''}
                `;
                item.onclick = (e) => {
                    if (e.target.tagName !== 'BUTTON') selectChannel(channel);
                };
                listEl.appendChild(item);
            }

            document.getElementById('currentChannelTitle').innerText = "# " + activeChannel;

            const tabsListEl = document.getElementById('tabsList');
            tabsListEl.innerHTML = '';

            if (appData[activeChannel]) {
                for (let tab in appData[activeChannel]) {
                    const tabEl = document.createElement('div');
                    tabEl.className = `tab-item ${tab === activeTab ? 'active' : ''}`;
                    tabEl.innerHTML = `
                        <span>${tab}</span>
                        ${Object.keys(appData[activeChannel]).length > 1 ? `<button class="tab-delete" onclick="deleteTab(event, '${tab}')">✕</button>` : ''}
                    `;
                    tabEl.onclick = (e) => {
                        if (e.target.tagName !== 'BUTTON') selectTab(tab);
                    };
                    tabsListEl.appendChild(tabEl);
                }
            }

            const textarea = document.getElementById('noteContent');
            if (activeChannel && activeTab && appData[activeChannel] && appData[activeChannel][activeTab] !== undefined) {
                textarea.value = appData[activeChannel][activeTab];
                textarea.disabled = false;
            } else {
                textarea.value = "";
                textarea.disabled = true;
            }
        }

        function selectChannel(channel) {
            activeChannel = channel;
            checkActiveTab();
            renderApp();
        }

        function selectTab(tab) {
            activeTab = tab;
            renderApp();
        }

        function addChannel() {
            const input = document.getElementById('newChannelName');
            let name = input.value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '');
            if (!name) return;
            if (appData[name]) {
                alert("Složka už existuje!");
                return;
            }
            appData[name] = { "uvod": "" };
            activeChannel = name;
            activeTab = "uvod";
            input.value = "";
            saveToCloud();
            renderApp();
        }

        function addTab() {
            const input = document.getElementById('newTabName');
            let name = input.value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '');
            if (!name) return;
            if (!appData[activeChannel]) return;
            
            if (appData[activeChannel][name] !== undefined) {
                alert("Záložka už existuje!");
                return;
            }
            appData[activeChannel][name] = "";
            activeTab = name;
            input.value = "";
            saveToCloud();
            renderApp();
        }

        function deleteChannel(e, channel) {
            e.stopPropagation();
            if (confirm(`Smazat složku #${channel}?`)) {
                delete appData[channel];
                const keys = Object.keys(appData);
                activeChannel = keys.length > 0 ? keys[0] : "";
                checkActiveTab();
                saveToCloud();
                renderApp();
            }
        }

        function deleteTab(e, tab) {
            e.stopPropagation();
            if (confirm(`Smazat záložku ${tab}?`)) {
                delete appData[activeChannel][tab];
                checkActiveTab();
                saveToCloud();
                renderApp();
            }
        }

        function updateContent() {
            if (activeChannel && activeTab && appData[activeChannel]) {
                appData[activeChannel][activeTab] = document.getElementById('noteContent').value;
                saveToCloud();
            }
        }
    </script>
</body>
</html>
